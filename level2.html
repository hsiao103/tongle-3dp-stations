<style>
:root{
  --bg:#0a1a33; --panel:#13233f; --panel2:#1a2f52; --line:#2f5086; --text:#ffffff; --sub:#b9cbe8;
  --orange:#ff8a1f; --orange2:#ffb066; --green:#39ff88; --red:#ff4d5e; --blue:#5aa9ff; --amber:#ffd24d;
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;font-size:18px;line-height:1.55}
body{
  background-image:linear-gradient(rgba(90,150,230,.16) 1px,transparent 1px),linear-gradient(90deg,rgba(90,150,230,.16) 1px,transparent 1px),
    linear-gradient(rgba(90,150,230,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(90,150,230,.07) 1px,transparent 1px);
  background-size:96px 96px,96px 96px,16px 16px,16px 16px;
}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#app{max-width:1180px;margin:0 auto;padding:10px 14px 90px;min-height:100dvh;display:flex;flex-direction:column;gap:12px}

/* 上方列 */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:6;background:rgba(10,26,51,.94);padding:6px 4px;margin:0 -4px;border-radius:0 0 12px 12px}
.brand{display:flex;flex-direction:column;line-height:1.2}
.brand b{font-size:24px;letter-spacing:.04em}.brand span{font-size:15px;color:var(--orange2)}
.chips{display:flex;gap:6px;flex:1;justify-content:center;flex-wrap:wrap}
.chip{padding:5px 14px;border-radius:99px;border:2px solid var(--line);color:var(--sub);font-size:16px;white-space:nowrap}
.chip.on{background:var(--orange);border-color:var(--orange);color:#1a0d00;font-weight:800}
.chip.fin{border-color:var(--green);color:var(--green)}
.badge{padding:5px 12px;border-radius:10px;font-size:16px;font-weight:700;border:2px solid var(--line);background:var(--panel)}
.badge.done{border-color:var(--green);color:var(--green);box-shadow:0 0 14px rgba(57,255,136,.4)}
#gear{width:52px;height:52px;border-radius:50%;border:2px solid var(--line);background:var(--panel);font-size:24px;position:relative;opacity:.8;padding:0}
#gear .ring{position:absolute;inset:-5px;border-radius:50%;background:conic-gradient(var(--orange) var(--p,0deg),transparent 0);-webkit-mask:radial-gradient(circle,transparent 60%,#000 62%);mask:radial-gradient(circle,transparent 60%,#000 62%);pointer-events:none}

/* 面板 */
.panel{background:linear-gradient(180deg,var(--panel2),var(--panel));border:2px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.panel h2{margin:0 0 8px;font-size:23px}.panel h3{margin:0 0 6px;font-size:19px;color:var(--orange2)}
.panel p{margin:6px 0}
.sub{color:var(--sub);font-size:16px}
.grid2{display:grid;grid-template-columns:1.15fr 1fr;gap:12px}
@media (max-width:860px){.grid2{grid-template-columns:1fr}#app{padding-bottom:100px}.brand b{font-size:20px}}
@media (max-width:640px){.top{gap:6px}.brand{flex:1;min-width:0}.brand b{font-size:18px}.brand span{font-size:12px}.chips{order:5;flex-basis:100%;gap:4px}.chip{padding:3px 10px;font-size:14px;flex:1;text-align:center}#gear{width:46px;height:46px}.badge{padding:4px 8px;font-size:14px}.panel{padding:12px}.readout{font-size:32px}.codebox .code{font-size:56px}}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{justify-content:space-between}

/* 按鈕 */
.btn{min-height:58px;padding:10px 22px;border-radius:14px;border:0;background:var(--orange);color:#1a0d00;font-weight:800;font-size:21px;box-shadow:0 4px 0 #a85509}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #a85509}
.btn.ghost{background:transparent;color:var(--text);border:2px solid var(--line);box-shadow:none;font-weight:600}
.btn.green{background:var(--green);box-shadow:0 4px 0 #1b9b52}
.btn[disabled]{background:#3a465c;color:#8e9bb3;box-shadow:none;cursor:not-allowed;transform:none}
.btn.big{width:100%;min-height:68px;font-size:24px}
.btn.small{min-height:44px;font-size:16px;padding:6px 14px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{min-height:62px;padding:8px 10px;border-radius:12px;border:2px solid var(--line);background:#0e1c34;font-size:17px;text-align:center;line-height:1.3}
.opt.on{border-color:var(--orange);background:rgba(255,138,31,.2);font-weight:800;box-shadow:0 0 0 2px var(--orange) inset}
.opt[disabled]{opacity:.55;cursor:not-allowed}
.optgrid{display:grid;grid-template-columns:1fr;gap:8px}
.setting{margin-bottom:10px}.setting>b{display:block;margin-bottom:4px;color:var(--orange2)}

/* SVG */
svg{display:block;width:100%;height:auto}
.ground{stroke:#6f8fbf;stroke-width:2}
.solid{fill:#2a4a80;stroke:#9cc4ff;stroke-width:2}
.accent{fill:#143258;stroke:var(--amber);stroke-width:2}
.led{fill:var(--green)}
.dash{stroke:var(--amber);stroke-width:2;stroke-dasharray:5 4}
.dim{stroke:#9cc4ff;stroke-width:1.5;fill:none}
.arc{stroke:var(--amber);stroke-width:2}
.note{fill:var(--amber);font-size:14px;font-weight:700}
.cap{fill:var(--sub);font-size:15px}
.contact{fill:none;stroke:var(--orange);stroke-width:2;stroke-dasharray:3 2}
.bed2{fill:rgba(255,255,255,.04);stroke:#38598f;stroke-dasharray:6 5}
.hit{fill:transparent;stroke:none}
.view3 .part{cursor:pointer;outline:none}
.view3 .part:hover .solid,.view3 .part:focus-visible .solid{stroke:#fff}
.view3 .part.marked .solid,.view3 .part.marked .contact{stroke:var(--orange);stroke-width:4;fill:rgba(255,138,31,.35);filter:drop-shadow(0 0 6px var(--orange))}
.view3 .part.marked .contact{fill:var(--orange)}
.ledge{stroke-width:16;stroke-linecap:butt}.ok-ledge{stroke:var(--green)}.bad-ledge{stroke:var(--red)}
.ref45{stroke:var(--amber);stroke-width:2;stroke-dasharray:6 5}
.noodle{fill:none;stroke:#ff9d6e;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
.noodle.bad{stroke:var(--red)}
.okt{fill:var(--green);font-weight:700}.badt{fill:#ff8d97;font-weight:700}
.lattice{fill:none;stroke:#7fe3ff;stroke-width:2.5;stroke-dasharray:5 3}.lattice.waste{stroke:#ff9d6e}
.crack{fill:none;stroke:var(--red);stroke-width:3}
.scratch{fill:none;stroke:var(--red);stroke-width:2}
.scene{background:radial-gradient(ellipse at 50% 100%,rgba(90,150,230,.18),transparent 70%);border-radius:12px}
.bed{fill:#4a5b7a;stroke:#9db2d6;stroke-width:2}.bedt{fill:#d7e3f8;font-size:10px}
.rail{stroke:#8aa4d0;stroke-width:3}.carr{fill:#3b5f9c;stroke:#9cc4ff}.nozzle{fill:var(--orange)}
.lab{fill:var(--orange2);font-size:15px;font-weight:700}
.led2{stroke:#0004;stroke-width:1}.led2.off{fill:#445}.led2.heat{fill:var(--orange)}.led2.green{fill:var(--green);filter:drop-shadow(0 0 5px var(--green))}.led2.red{fill:var(--red);filter:drop-shadow(0 0 5px var(--red))}
.snap{fill:var(--red);font-weight:900}
.hlbox{stroke:var(--orange);stroke-width:3;stroke-dasharray:8 5;animation:pulse 1.2s ease-in-out infinite}
.bad{stroke:var(--red)!important;animation:flash .5s ease-in-out 4}
.demo{background:rgba(255,255,255,.04);border-radius:12px}
.hatch{animation:none}
.peg{fill:var(--amber);stroke:#0006;stroke-width:1}.seam{stroke:var(--amber);stroke-width:2;stroke-dasharray:3 2}
.hole{fill:#06101f;stroke:#9cc4ff;stroke-width:2}.glue{fill:var(--orange2)}
@keyframes slidein{0%,15%{transform:translateX(30px)}55%,100%{transform:translateX(-20px)}}
.slidein{animation:slidein 3.6s ease-in-out infinite}
@keyframes slidein2{0%,15%{transform:translateX(26px)}55%,100%{transform:translateX(0)}}
.slidein2{animation:slidein2 3.6s ease-in-out infinite}

/* 動畫 */
@keyframes pulse{50%{opacity:.35}}
@keyframes flash{50%{filter:drop-shadow(0 0 8px var(--red));fill:rgba(255,77,94,.55)}}
@keyframes droop{0%,30%{transform:rotate(0)}70%,100%{transform:rotate(50deg)}}
.droop{animation:droop 3.2s ease-in-out infinite}
@keyframes armfall{0%,45%{transform:rotate(0)}70%,100%{transform:rotate(20deg) translateY(4px)}}
.armfall{animation:armfall 3.6s ease-in infinite}
@keyframes crackin{0%,55%{opacity:0}70%,100%{opacity:1}}
.demo .crack{animation:crackin 3.6s infinite}
@keyframes wob{0%,40%{transform:rotate(0)}70%{transform:rotate(9deg)}100%{transform:rotate(60deg) translateY(10px)}}
.wobble{animation:wob 3.4s ease-in infinite}
@keyframes steady{50%{transform:translateY(-3px)}}
.steady{animation:steady 1.6s ease-in-out infinite}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.shake{animation:shake .4s}
@keyframes pop{0%{transform:scale(.8);opacity:0}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .35s ease-out}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .droop{transform:rotate(50deg)}.armfall{transform:rotate(20deg) translateY(4px)}.wobble{transform:rotate(60deg) translateY(10px)}.slidein{transform:translateX(-20px)}
}

/* 範圍滑桿 */
input[type=range]{width:100%;height:56px;touch-action:none;accent-color:var(--orange);background:transparent}
input[type=range]::-webkit-slider-thumb{width:44px;height:44px}
input[type=range]::-moz-range-thumb{width:44px;height:44px}
.readout{font-size:40px;font-weight:900;color:var(--amber);text-align:center;letter-spacing:.02em}
.verdict{font-size:20px;font-weight:800;text-align:center;min-height:32px}
.verdict.ok{color:var(--green)}.verdict.bad{color:#ff8d97}

/* 診斷 */
.tabs{display:flex;gap:8px;margin-bottom:8px}
.tab{flex:1;min-height:52px;border-radius:12px;border:2px solid var(--line);background:#0e1c34;font-size:18px;font-weight:700}
.tab.on{border-color:var(--orange);background:rgba(255,138,31,.2)}
.tab.seen::after{content:" ✓";color:var(--green)}
.partchips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0}
.pchip{min-height:56px;border-radius:12px;border:2px solid var(--line);background:#0e1c34;font-size:18px;font-weight:700}
.pchip.on{border-color:var(--orange);background:rgba(255,138,31,.25)}
.reasons{display:grid;gap:8px;margin-top:6px}
.reasons .opt{text-align:left;padding:10px 14px}
.reasons .opt.good{border-color:var(--green);background:rgba(57,255,136,.15)}
.reasons .opt.wrong{border-color:var(--red);background:rgba(255,77,94,.15)}

/* 結果 */
.res2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}

.rescard{border-radius:12px;border:2px solid var(--line);padding:10px 12px;background:#0e1c34}
.rescard.pass{border-color:var(--green)}.rescard.fail{border-color:var(--red);background:rgba(255,77,94,.1)}
.rescard b{display:block;font-size:19px}.rescard.pass b{color:var(--green)}.rescard.fail b{color:#ff8d97}
.note-box{border-left:5px solid var(--amber);background:rgba(255,210,77,.1);padding:8px 12px;border-radius:8px;margin-top:8px}
.msg{min-height:28px;margin-top:8px;font-size:18px}
.msg.bad{color:#ff9aa3}.msg.good{color:var(--green)}.msg.info{color:var(--amber)}

/* 成功 */
.codebox{margin:10px 0;padding:14px;border:3px dashed var(--green);border-radius:16px;text-align:center;background:rgba(57,255,136,.08)}
.codebox .code{font-size:72px;font-weight:900;letter-spacing:.2em;color:var(--green);text-shadow:0 0 18px rgba(57,255,136,.6);line-height:1.1}
.icon-laser{width:120px;margin:0 auto}

/* 底部列 */
.foot{position:fixed;left:0;right:0;bottom:0;padding:8px 14px calc(8px + env(safe-area-inset-bottom));background:linear-gradient(0deg,#07122b 70%,transparent);display:flex;gap:10px;align-items:center;justify-content:center;z-index:5}

#hintsheet .lv{color:var(--amber);font-weight:800}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:30;max-width:92vw;padding:10px 18px;border-radius:12px;font-weight:700;background:#102b4d;border:2px solid var(--line);box-shadow:0 8px 24px #000a}

/* 覆蓋層 */

.overlay .box{max-width:560px;width:100%;background:var(--panel);border:3px solid var(--orange);border-radius:20px;padding:20px;text-align:center}
.overlay.lock .box{border-color:var(--red)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.keypad button{min-height:60px;font-size:26px;border-radius:12px;border:2px solid var(--line);background:#0e1c34}

.stage3d .thermo .f.front{background:#e8eefb}
.th{position:relative;width:100%;height:100%;color:#1a2f55;font-size:9px;font-weight:800;text-align:center}
.th i{position:absolute;left:13px;top:10px;bottom:22px;width:8px;border-radius:4px;background:linear-gradient(0deg,#4aa3ff 0 22%,#cfd8ea 22%)}
.th b{position:absolute;left:0;right:0;bottom:4px}
.stage3d .screen .f.front{background:#0a1a30;overflow:hidden}
.scr{font-size:9px;line-height:1.45;color:#7fffd4;padding:4px 5px;font-weight:700}.scr b{display:block}.scr i{font-style:normal;color:#ffd24d}.scr .lowtemp{color:#ff8d97}
.stage3d .bed .f.top{background-image:linear-gradient(rgba(255,255,255,.1) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.1) 1px,transparent 1px);background-size:22px 22px}
.stage3d .tip .f{background:var(--c,#ff8a1f)}
.stage3d .disc{position:absolute;border-radius:50%;backface-visibility:visible}
.stage3d .disc.flange{box-shadow:inset 0 0 0 3px #8aa4d0}.stage3d .disc.wire{box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}.stage3d .disc.hub{box-shadow:inset 0 0 0 2px #52688c}

.stage3d .fline{position:absolute;height:3px;top:-1.5px;background:#27c3a8;transform-style:flat}
.stage3d .box .f{background-image:linear-gradient(90deg,transparent 46%,rgba(80,40,0,.25) 46% 54%,transparent 54%)}
.stage3d .holo .f{background:rgba(90,200,255,var(--ha,.12));border:1.5px solid rgba(127,227,255,var(--hb,1));filter:none}

.stage3d .holebad .f{background:#ff4d5e;filter:none}
.stage3d .scan .f{background:rgba(127,227,255,.4);border:1px solid #bff3ff;filter:none}
.stage3d .slice .f{background:rgba(90,169,255,.16);border:1px solid rgba(127,227,255,.75);filter:none}
.stage3d .pl .f{backface-visibility:visible;filter:none}
.stage3d .scan .f{background:rgba(127,227,255,.35);border:1px solid #bff3ff}
.stage3d .slice.brimghost .f,.stage3d .slice.supp .f{background:rgba(255,210,77,.35);border-color:#ffd24d}
.stage3d .part .f{background-color:var(--c,#d9dee9)}

.eye{position:absolute;top:8px;width:5px;height:7px;background:#16233f;border-radius:2px;opacity:var(--face,0)}.eye.l{left:9px}.eye.r{right:9px}
.mouth{position:absolute;left:12px;right:12px;top:19px;height:3px;border-radius:0 0 4px 4px;background:#b8433f;opacity:var(--face,0)}
.warn3d{position:absolute;left:0;top:0;white-space:nowrap;font-size:12px;font-weight:900;color:#fff;background:#d6303f;padding:2px 8px;border-radius:8px;transform-style:flat}
.stage3d .turn .f{background:#314b78}
.stage3d .tl .f,.stage3d .tool .f{filter:none}
.stage3d .heater.glow .f{box-shadow:0 0 18px #ff6a1a inset}
.stage3d .shield .f{background:rgba(215,236,255,.28);border:1px solid #eaf5ff;filter:none}
.stage3d .wind .f{filter:none}
.stage3d .mist{opacity:.7}
.stagetools{display:flex;gap:8px;position:absolute;right:8px;top:8px;z-index:3}

/* 題目卡 */

.readings{width:100%;border-collapse:collapse;margin:6px 0 10px;font-size:17px}

input[type=text]{min-height:52px;font-size:22px;padding:6px 12px;border-radius:12px;border:2px solid var(--line);background:#0e1c34;color:#fff;width:190px;letter-spacing:.2em;text-align:center}

/* ---- 插圖（圖缺了就整塊不顯示，畫面照常） ---- */

.artimg.hero{max-height:230px;width:auto}
.artimg.banner{width:auto;max-width:100%;max-height:150px;margin:4px auto 8px;border:2px solid var(--line)}
.artrow{display:flex;gap:10px;justify-content:center;align-items:flex-end;flex-wrap:wrap}.artrow .artimg{max-height:150px;width:auto;margin:4px}
@media (max-width:640px){.artimg.hero{max-height:170px}.artimg.banner{max-height:100px}}
@media (prefers-reduced-motion:no-preference){.artimg{animation:artin .35s ease-out}}@keyframes artin{from{opacity:0;transform:translateY(4px)}to{opacity:1}}

<body>
<div id="app">
  <header class="top">
    <div class="brand"><b id="brandT"></b><span id="brandS"></span></div>
    <div class="chips" id="chips"></div>
    <span class="badge" id="grp"></span>
    <span class="badge done hidden" id="donebadge">✔ 已完成</span>
    <button id="gear" aria-label="關主（長按 3 秒）" title="關主專用：長按 3 秒"><span class="ring"></span>⚙</button>
  </header>
  <main id="main"></main>
</div>
<div class="foot"><button class="btn ghost hidden" id="hintbtn"></button><span class="info" id="info"></span></div>
<div id="hintsheet" class="hidden" role="status"></div>
<div id="toast" class="hidden" role="status" aria-live="polite"></div>
<div id="lock" class="overlay lock hidden"><div class="box"><h2>🔒 機器暫停</h2><p id="lockmsg"></p>
  <button class="btn ghost" id="lockhold" style="width:100%;position:relative"><span class="ring" style="position:absolute;inset:-4px;border-radius:18px;background:conic-gradient(var(--orange) var(--p,0deg),transparent 0);-webkit-mask:linear-gradient(#000 0 0);pointer-events:none;opacity:.35"></span>關主：長按 3 秒解鎖</button></div></div>
<div id="adm" class="overlay hidden"></div>
<script id="anim">
/* =====================================================================
   動畫時間軸（純函式，不碰畫面）：把「做到哪一步、動畫播到幾 %」換成 3D 場景的狀態
   ===================================================================== */
const Anim = (() => {
  "use strict";
  const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
  const seg = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
  const tri = (t) => 1 - Math.abs(2 * t - 1);

  /* 場景所有會變的量（全部 0～1，除非另外註明） */
  const DEFAULT = Object.freeze({
    mesh: 0,       // 模型：0＝線框（未檢查）→ 1＝實心（已修補）
    scan: 0,       // 檢查掃描線位置（動畫中才有值）
    pkg: 0,        // 包裹送到桌上
    pkgOpen: 0,    // 包裹打開，露出新線材卷
    plan: 0,       // 切片規劃：藍色層線、底座與支撐的預覽
    spoolSwap: 0,  // 0＝舊的少量線材卷在機器上；1＝換成新卷
    feed: 0,       // 線材已送進噴頭
    level: 0,      // 0＝平台傾斜（不平）→ 1＝已調平
    warm: 0,       // 環境改善（冷風消失、變暖）
    bedHeat: 0,    // 平台溫度：0＝冷、依環境的實際值…；以 warm 與此值共同決定
    print: 0,      // 列印進度
    warp: 0,       // 底座右前角翹起
    brimBig: 0,    // 加大外圈 brim
    park: 0,       // 噴頭停靠
    lift: 0,       // 成品取下
    cut: 0,        // 支撐已剪掉（動畫中顯示斜口鉗）
    sand: 0,       // 打磨（動畫中顯示砂紙）
    paint: 0,      // 上色進度（動畫中顯示噴槍）
    gloss: 0       // 保護漆光澤
  });

  /* 每個「做對了」會播的動畫：t = 0～1 → 要改的量 */
  const PATCH = {
    design:    (t) => ({ scan: t >= 1 ? 0 : tri(seg(t, 0, 0.9)), mesh: seg(t, 0.15, 0.9) }),
    buy:       (t) => ({ pkg: seg(t, 0, 0.45), pkgOpen: seg(t, 0.5, 0.9) }),
    slice:     (t) => ({ plan: seg(t, 0, 0.85) }),
    filament:  (t) => ({ spoolSwap: seg(t, 0, 0.55), feed: seg(t, 0.55, 1) }),
    plate:     (t) => ({ level: seg(t, 0, 0.9) }),
    env:       (t) => ({ warm: seg(t, 0, 0.55), bedHeat: seg(t, 0.35, 1) }),
    startPrint:(t) => ({ print: 0.14 * seg(t, 0, 0.8), warp: seg(t, 0.8, 1) }),
    watch:     (t) => ({ warp: 1 - seg(t, 0, 0.25), park: tri(seg(t, 0.05, 0.4)), brimBig: seg(t, 0.25, 0.4), print: 0.14 + 0.86 * seg(t, 0.42, 1) }),
    post:      (t) => ({ bedHeat: 1 - seg(t, 0, 0.2), lift: seg(t, 0.2, 0.45), cut: seg(t, 0.45, 0.7), sand: seg(t, 0.7, 1) }),
    paint:     (t) => ({ paint: seg(t, 0, 0.8), gloss: seg(t, 0.8, 1) })
  };
  /* 動畫進行中，工具（斜口鉗、砂紙、噴槍）只在過程中出現：用「做到一半」判斷 */
  const ORDER = ["design", "buy", "slice", "filament", "plate", "env", "startPrint", "watch", "post", "paint"];
  const KEYS = ORDER.slice();
  const finalOf = (k) => PATCH[k](1);
  const merge = (a, b) => Object.assign({}, a, b);

  /* 目前已完成的項目（對照存檔） */
  function doneKeys(done, started) {
    const r = ORDER.filter((k) => (k === "startPrint" ? !!started : !!(done && done[k])));
    return r;
  }
  /* 場景狀態：已完成的項目都是「完成後的樣子」；exclude 的項目播到 t */
  function stateFor(done, started, active, t) {
    let s = Object.assign({}, DEFAULT);
    doneKeys(done, started).forEach((k) => { if (k !== active) s = merge(s, finalOf(k)); });
    if (active && PATCH[active]) s = merge(s, PATCH[active](clamp(t == null ? 1 : t, 0, 1)));
    return s;
  }

  /* 鏡頭：自動推近到每一步的重點。focus=世界座標(x,y,z)，y 往上 */
  const CAM = {
    intro:      { ry: -32, rx: -20, z: 1.0, f: [0, 70, 0] },
    design:     { ry: -22, rx: -14, z: 1.75, f: [0, 92, 0] },
    buy:        { ry: -42, rx: -22, z: 1.55, f: [-120, 24, 60] },
    slice:      { ry: -26, rx: -14, z: 1.75, f: [0, 92, 0] },
    filament:   { ry: -46, rx: -16, z: 1.8, f: [140, 110, -10] },
    plate:      { ry: -18, rx: -26, z: 1.9, f: [30, 46, 50] },
    env:        { ry: -24, rx: -16, z: 1.1, f: [0, 100, -40] },
    startPrint: { ry: -26, rx: -18, z: 1.9, f: [0, 70, 0] },
    watch:      { ry: -30, rx: -20, z: 2.0, f: [0, 62, 0] },
    post:       { ry: -24, rx: -14, z: 1.9, f: [-78, 50, 108] },
    paint:      { ry: -20, rx: -12, z: 2.0, f: [-78, 52, 108] },
    done:       { ry: -22, rx: -12, z: 2.0, f: [-78, 52, 108] }
  };

  /* 動畫時間長度倍率（巡檢動畫較長） */
  const DUR = { watch: 1.4, post: 1.3, paint: 1.2 };

  return { DEFAULT, PATCH, ORDER, KEYS, CAM, DUR, finalOf, doneKeys, stateFor, seg, clamp };
})();

<script id="logic">
/* =====================================================================
   遊戲邏輯層：不碰畫面的純函式。reduce(state, action, now) → {state, fb}
   ===================================================================== */
const Logic = (() => {
  "use strict";
  const C = CONFIG;
  const STEPS = C.steps;
  /* ---- 題庫：目前使用的那一套（A/B/C/D）。reduce 與還原時會依狀態切換 ---- */
  const BANKS = C.banks, BANK_KEYS = Object.keys(BANKS);
  let curBank = "A";
  function useBank(key) {
    if (!BANKS[key]) key = BANK_KEYS[0];
    const b = BANKS[key]; C.questions = b.questions; C.env = b.env; C.fila = b.fila; C.plate = b.plate; curBank = key; return key;
  }
  const pickBank = (seed, avoid) => { let i = (hash("bank" + (seed >>> 0)) >>> 0) % BANK_KEYS.length; if (avoid && BANK_KEYS[i] === avoid && BANK_KEYS.length > 1) i = (i + 1) % BANK_KEYS.length; return BANK_KEYS[i]; };
  const Q = new Proxy({}, { get: (_, k) => C.questions[k], has: (_, k) => k in C.questions });
  const QIDS = STEPS.flatMap((s) => s.qs);
  const stepOfQ = {}; STEPS.forEach((s, i) => s.qs.forEach((q) => { stepOfQ[q] = i; }));
  const GATE = STEPS.findIndex((s) => s.gate);
  const clone = (o) => JSON.parse(JSON.stringify(o));

  const esc = (s) => String(s).replace(/[&<>"'`]/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;", "`": "&#96;" }[ch]));

  /* 可重現的洗牌（同一個種子順序固定，重整不會變） */
  function rng(seed) { let a = (seed >>> 0) || 1; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  function shuffle(arr, seed) {
    const a = arr.slice(); const r = rng(seed);
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  const hash = (str) => { let h = 7; for (let i = 0; i < str.length; i++) h = (Math.imul(h, 31) + str.charCodeAt(i)) >>> 0; return h; };

  const codeFor = (group) => { const l = C.groupCodes; return l[(((group | 0) - 1) % l.length + l.length) % l.length]; };
  const checkPin = (pin) => String(pin) === String(C.masterPin);
  const cooldownLeft = (s, now) => Math.max(0, s.cooldownUntil - now);

  /* ---------- 題目輔助 ---------- */
  function optionIds(qid) {
    const q = Q[qid];
    return q.kind === "choice" ? q.options.map((o) => o.id) : q.pick.objs.concat(["release"]);
  }
  const isCorrect = (qid, opt) => { const q = Q[qid]; return q.kind === "choice" ? !!q.options.find((o) => o.id === opt && o.correct) : opt === q.pick.correct; };
  function whyOf(qid, opt) {
    const q = Q[qid];
    if (q.kind === "choice") { const o = q.options.find((x) => x.id === opt); return o ? (o.why || "") : ""; }
    return q.pick.why[opt] || "";
  }
  /* 玩家看到的選項（順序依種子打亂，重整不變）；pick 題回傳物件 id */
  function optionsOf(st, qid) {
    const q = Q[qid];
    if (q.kind === "choice") return shuffle(q.options.map((o) => ({ id: o.id, text: o.text })), st.seed + hash(qid));
    return shuffle(q.pick.objs.map((id) => ({ id, text: C.objects[id].name })).concat([{ id: "release", text: "沒問題，放行" }]), st.seed + hash(qid));
  }
  const reviewOptions = (st, qi) => shuffle(C.review[qi].options.map((o) => ({ id: o.id, text: o.text })), st.seed + 101 + qi * 7);

  /* ---------- 檢核讀數（由 CONFIG 的數字產生；flag 只給測試用，畫面不顯示） ---------- */
  function readings(qid) {
    const f = C.fila, p = C.plate, e = C.env, g = p.gaps;
    if (qid === "filament") return [
      { label: "線材種類", value: "PLA", abnormal: false },
      { label: "受潮狀況", value: f.wet ? "有爆音，線材表面起小泡" : "乾燥，沒有爆音", abnormal: !!f.wet },
      { label: "線材卷剩餘", value: f.remainG + " g", abnormal: f.remainG < f.needG },
      { label: "這隻公仔預估用量", value: f.needG + " g", abnormal: false }
    ];
    if (qid === "plate") {
      const vals = [g.lf, g.rf, g.lb, g.rb]; const spread = Math.max.apply(null, vals) - Math.min.apply(null, vals);
      return [
        { label: "平台材質", value: "PEI 彈性片（磁吸式，吸在加熱床上）", abnormal: false },
        { label: "表面狀態", value: p.dirty ? "有手指印和一層油光" : "乾淨，沒有指紋油汙", abnormal: !!p.dirty },
        { label: "四角間隙（紙張法）", value: "左前 " + g.lf.toFixed(2) + "、右前 " + g.rf.toFixed(2) + "、左後 " + g.lb.toFixed(2) + "、右後 " + g.rb.toFixed(2) + " mm（差距在容許內）", abnormal: spread > p.tol },
        { label: "板子固定狀況", value: p.seated ? "整片吸平，推不動" : (p.seatNote || "右前角輕按會翹動，邊緣有縫隙，一推就滑"), abnormal: !p.seated }
      ];
    }
    if (qid === "env") return [
      { label: "室溫", value: e.room + " ℃", abnormal: false },
      { label: "平台目標溫度", value: e.bedTarget + " ℃", abnormal: false },
      { label: "平台目前溫度", value: e.bedNow + " ℃（升溫很慢）", abnormal: e.bedNow < e.bedTarget },
      { label: "擺放位置", value: e.place || "窗邊，冷風直接吹到機器", abnormal: true }
    ];
    return [];
  }

  /* ---------- 初始狀態 ---------- */
  function initial(group, seed, avoidBank) {
    const n = C.groupCodes.length; let g = Math.floor(Number(group));
    if (!(g >= 1 && g <= n)) g = 1;
    const hs = {}; QIDS.forEach((q) => { hs[q] = 0; });
    return {
      v: 1, group: g, seed: (seed >>> 0) || 1, bank: pickBank((seed >>> 0) || 1, avoidBank), linked: false, phase: "intro", step: 0,
      done: {}, started: false,
      failCount: 0, stepFails: 0, cooldownUntil: 0, locked: false,
      hintSeen: hs, hintsUsed: 0, completed: false, animating: false, pending: null
    };
  }

  const stepComplete = (s, i) => STEPS[i].qs.every((q) => s.done[q]) && (!STEPS[i].gate || s.started);
  const firstOpenStep = (s) => { for (let i = 0; i < STEPS.length; i++) if (!stepComplete(s, i)) return i; return STEPS.length; };
  function successInfo(s) {
    const code = codeFor(s.group); const fill = (t) => String(t).split("{code}").join(code);
    return { code, label: C.codeLabel, story: fill(C.story.success), next: fill(C.story.next), group: s.group };
  }
  const missingChecks = (s) => STEPS[GATE].qs.filter((q) => !s.done[q]);

  /* ---------- 唯一的狀態轉換函式 ---------- */
  function reduce(st, a, now) {
    now = Number(now) || 0;
    if (st && st.bank && st.bank !== curBank) useBank(st.bank);
    const s = clone(st);
    const rej = (kind, extra) => ({ state: st, fb: Object.assign({ ok: false, kind }, extra || {}) });
    const ok = (kind, extra) => ({ state: s, fb: Object.assign({ ok: true, kind }, extra || {}) });
    const playGuard = () => {
      if (s.phase === "done") return "completed";
      if (s.phase !== "play") return "badPhase";
      if (s.animating) return "busy";
      if (s.locked) return "locked";
      return null;
    };

    switch (a.type) {
      case "link": {
        if (s.phase !== "intro") return rej("badPhase");
        if (!C.link.enabled) return rej("linkOff");
        const idx = C.link.codes.indexOf(String(a.code == null ? "" : a.code).trim());
        if (idx < 0) return rej("badCode");
        s.group = idx + 1; s.linked = true; return ok("linked", { group: s.group });
      }
      case "start":
        if (s.phase !== "intro") return rej("badPhase");
        s.phase = "play"; s.step = 0; return ok("started");

      case "answer": {
        const g = playGuard(); if (g) return rej(g);
        const q = Q[a.qid]; if (!q) return rej("badValue");
        if (stepOfQ[a.qid] !== s.step) return rej("notThisStep");
        if (s.done[a.qid]) return rej("already");
        if (!optionIds(a.qid).includes(a.option)) return rej("badValue");
        if (now < s.cooldownUntil) return rej("cooldown", { leftMs: s.cooldownUntil - now });
        if (isCorrect(a.qid, a.option)) {
          s.done[a.qid] = true; s.animating = true;
          const advance = stepComplete(s, s.step);
          s.pending = { advance };
          return ok("correct", { qid: a.qid, anim: a.qid, learn: q.learn, advance, gateReady: !!STEPS[s.step].gate && STEPS[s.step].qs.every((x) => s.done[x]) && !s.started });
        }
        s.failCount++; s.stepFails++;
        s.cooldownUntil = now + C.timing.cooldownMs;
        if (s.stepFails >= C.timing.lockAfter) s.locked = true;
        return ok("wrong", { qid: a.qid, text: whyOf(a.qid, a.option), failCount: s.failCount, stepFails: s.stepFails, lockedNow: s.locked });
      }

      case "startPrint": {
        const g = playGuard(); if (g) return rej(g);
        if (s.step !== GATE) return rej("notThisStep");
        if (s.started) return rej("already");
        const miss = missingChecks(s); if (miss.length) return rej("needChecks", { missing: miss });
        s.started = true; s.animating = true; s.pending = { advance: true };
        return ok("printStart", { anim: "startPrint", advance: true });
      }

      case "animEnd": {
        s.animating = false;
        const adv = s.pending && s.pending.advance; s.pending = null;
        if (adv) {
          s.stepFails = 0; s.step = firstOpenStep(s);
          if (s.step >= STEPS.length) { s.phase = "done"; s.completed = true; s.step = STEPS.length - 1; }
        }
        return ok("animEnd", { advanced: !!adv });
      }

      case "replay":
        if (s.phase !== "done") return rej("notDone");
        if (s.animating) return rej("busy");
        s.animating = true; s.pending = null; return ok("replay", { success: successInfo(s) });
      case "showSuccess":
        if (s.phase !== "done") return rej("notDone");
        return ok("success", { success: successInfo(s) });
      case "review": {
        if (s.phase !== "done") return rej("notDone");
        const q = C.review[a.q]; if (!q) return rej("badValue");
        const o = q.options.find((x) => x.id === a.option); if (!o) return rej("badValue");
        return ok("review", { correct: !!o.correct, text: o.why || "" });
      }

      /* 提示（每題由淺到深，依序解鎖；不直接公布答案） */
      case "hint": {
        if (s.phase !== "play") return rej("noHint");
        const q = Q[a.qid]; if (!q || stepOfQ[a.qid] !== s.step || s.done[a.qid]) return rej("noHint");
        const seen = s.hintSeen[a.qid];
        let lv = a.level ? Math.floor(Number(a.level)) : seen + 1;
        if (!Number.isFinite(lv)) lv = seen + 1;
        lv = Math.max(1, Math.min(lv, seen + 1, 3));
        s.hintSeen[a.qid] = Math.max(seen, lv); s.hintsUsed++;
        return ok("hint", { level: lv, qid: a.qid, text: q.hints[lv - 1] });
      }

      /* 關主 */
      case "unlock":
        if (!checkPin(a.pin)) return rej("badPin");
        s.locked = false; s.stepFails = 0; return ok("unlocked");
      case "reset": {
        if (!checkPin(a.pin)) return rej("badPin");
        const next = initial(a.group != null ? a.group : s.group, a.seed != null ? a.seed : s.seed + 1, s.bank); useBank(next.bank);
        return { state: next, fb: { ok: true, kind: "reset" } };
      }
    }
    return rej("unknown");
  }

  /* ---------- 存檔／還原（嚴格驗證；被改壞或竄改就回到全新狀態）---------- */
  function serialize(s) {
    return JSON.stringify({
      v: 1, group: s.group, seed: s.seed, bank: s.bank, linked: s.linked, phase: s.phase, done: s.done, started: s.started,
      failCount: s.failCount, stepFails: s.stepFails, cooldownUntil: s.cooldownUntil, locked: s.locked,
      hintSeen: s.hintSeen, hintsUsed: s.hintsUsed, completed: s.completed
    });
  }
  function restore(json, now, seed) {
    const fresh = () => { const f = initial(1, seed); useBank(f.bank); return f; };
    if (!json) return fresh();
    try {
      const o = JSON.parse(json);
      if (!o || o.v !== 1) return fresh();
      const isInt = (n, lo, hi) => Number.isInteger(n) && n >= lo && n <= hi;
      if (!isInt(o.group, 1, C.groupCodes.length) || !isInt(o.seed, 1, 4294967295)) return fresh();
      if (!["intro", "play", "done"].includes(o.phase)) return fresh();
      if (typeof o.linked !== "boolean" || typeof o.started !== "boolean" || typeof o.locked !== "boolean" || typeof o.completed !== "boolean") return fresh();
      if (!isInt(o.failCount, 0, 1e6) || !isInt(o.stepFails, 0, 1e6) || !isInt(o.hintsUsed, 0, 1e6)) return fresh();
      if (!Number.isFinite(o.cooldownUntil) || o.cooldownUntil < 0) return fresh();
      if (!o.done || typeof o.done !== "object" || Array.isArray(o.done)) return fresh();
      if (!Object.keys(o.done).every((k) => QIDS.includes(k) && o.done[k] === true)) return fresh();
      const hs = o.hintSeen; if (!hs || !QIDS.every((k) => isInt(hs[k], 0, 3))) return fresh();
      if (o.bank !== undefined && !BANKS[o.bank]) return fresh();
      const s = initial(o.group, o.seed); if (o.bank !== undefined) s.bank = o.bank;
      s.linked = o.linked; s.done = clone(o.done); s.started = o.started;
      /* 順序要說得通：後面的題有做，前面的步驟一定要完成 */
      for (let i = 0; i < STEPS.length; i++) {
        const any = STEPS[i].qs.some((q) => s.done[q]) || (STEPS[i].gate && s.started);
        if (any) for (let j = 0; j < i; j++) if (!stepComplete(s, j)) return fresh();
      }
      if (s.started && !STEPS[GATE].qs.every((q) => s.done[q])) return fresh();
      const open = firstOpenStep(s); const finished = open >= STEPS.length;
      /* 全部做完的存檔，即使最後一個動畫還沒播完就重整，也算完成；但沒做完卻宣稱完成就是竄改 */
      if ((o.completed || o.phase === "done") && !finished) return fresh();
      if (o.completed !== (o.phase === "done")) return fresh();
      if (o.phase === "intro" && (Object.keys(s.done).length || s.started)) return fresh();
      s.phase = finished ? "done" : (Object.keys(s.done).length || s.started ? "play" : o.phase); s.completed = finished;
      s.step = open >= STEPS.length ? STEPS.length - 1 : open;
      s.failCount = o.failCount; s.stepFails = o.stepFails; s.locked = o.locked; s.hintSeen = clone(hs); s.hintsUsed = o.hintsUsed;
      s.cooldownUntil = Math.min(o.cooldownUntil, (Number(now) || 0) + C.timing.cooldownMs);
      s.animating = false; s.pending = null;
      useBank(s.bank);
      return s;
    } catch (e) { return fresh(); }
  }

  /* localStorage 包 try/catch，失敗就退回記憶體變數 */
  function makeStore(storage, key) {
    let mem = null; let useMem = !storage;
    return {
      get() { if (!useMem) { try { return storage.getItem(key); } catch (e) { useMem = true; } } return mem; },
      set(v) { if (!useMem) { try { storage.setItem(key, v); return; } catch (e) { useMem = true; } } mem = v; },
      del() { mem = null; if (storage) { try { storage.removeItem(key); } catch (e) { /* 忽略 */ } } },
      get usingMemory() { return useMem; }
    };
  }

  return {
    initial, reduce, useBank, pickBank, BANK_KEYS, serialize, restore, makeStore, esc, shuffle, hash,
    optionsOf, reviewOptions, readings, isCorrect, whyOf, optionIds, cooldownLeft, checkPin, codeFor, successInfo,
    stepComplete, firstOpenStep, missingChecks,
    consts: { STEPS, QIDS, GATE, stepOfQ }
  };
})();

</script>
<script id="tests">
/* =====================================================================
   自動測試（對應「自動測試表」）。網址加 ?test=1 會在頁面上顯示通過／失敗
   ===================================================================== */
const Tests = (() => {
  "use strict";
  const C = CONFIG, L = Logic;
  const { STEPS, QIDS, GATE } = L.consts;
  const T0 = 1000000, CD = C.timing.cooldownMs;
  const list = [];
  const T = (name, fn) => list.push({ name, fn });
  const eq = (a, b, m) => { const x = JSON.stringify(a), y = JSON.stringify(b); if (x !== y) throw new Error((m || "不相等") + "：得到 " + x + "，預期 " + y); };
  const ok = (c, m) => { if (!c) throw new Error(m || "條件不成立"); };

  const correctOf = (q) => (C.questions[q].kind === "choice" ? C.questions[q].options.find((o) => o.correct).id : C.questions[q].pick.correct);
  const wrongOf = (q) => L.optionIds(q).filter((o) => o !== correctOf(q));
  const qText = (q, opt) => L.whyOf(q, opt);

  /* 小工具：依序套用動作（時間自己往前走） */
  function drive(st, t) {
    const o = { st, t, fb: null };
    o.go = (a, dt) => { L.useBank(o.st.bank); o.t += (dt == null ? CD + 50 : dt); const r = L.reduce(o.st, a, o.t); o.st = r.state; o.fb = r.fb; return r.fb; };
    o.ok = (q) => { L.useBank(o.st.bank); return o.go({ type: "answer", qid: q, option: correctOf(q) }); };
    o.end = () => o.go({ type: "animEnd" }, 0);
    return o;
  }
  /* 走到第 i 步開頭（前面的步驟都做完、動畫也播完） */
  function toStep(i, group) {
    const d = drive(L.initial(group || 1, 7), T0); d.go({ type: "start" });
    for (let k = 0; k < i; k++) {
      STEPS[k].qs.forEach((q) => { d.ok(q); if (!STEPS[k].gate) d.end(); else d.end(); });
      if (STEPS[k].gate) { d.go({ type: "startPrint" }); d.end(); }
    }
    return d;
  }
  const allDone = () => toStep(STEPS.length - 1).ok && (() => { const d = toStep(STEPS.length - 1); d.ok("paint"); d.end(); return d; })();

  /* ---------- T1 初始狀態 ---------- */
  T("T1-1 初始：在說明畫面，什麼都還沒做", () => {
    const s = L.initial(1, 5); eq(s.phase, "intro"); eq(s.step, 0); eq(s.done, {}); eq(s.started, false);
    eq(s.failCount, 0); eq(s.locked, false); eq(s.completed, false); eq(s.animating, false);
  });
  T("T1-2 還沒開始就答題或開始列印，一律被拒絕", () => {
    const s = L.initial(1, 5);
    eq(L.reduce(s, { type: "answer", qid: "design", option: "a" }, T0).fb.kind, "badPhase");
    eq(L.reduce(s, { type: "startPrint" }, T0).fb.kind, "badPhase");
  });
  T("T1-3 按開始後進入第 1 步", () => {
    const r = L.reduce(L.initial(1, 5), { type: "start" }, T0); eq(r.state.phase, "play"); eq(r.state.step, 0);
    eq(L.reduce(r.state, { type: "start" }, T0).fb.kind, "badPhase");
  });

  /* ---------- T2 每題只有一個正解 ---------- */
  T("T2-1 每題只有一個正確選項（窮舉）", () => {

    eq(STEPS.filter((s) => s.gate).length, 1); eq(STEPS.length, 7);
    QIDS.forEach((q) => { const ids = L.optionIds(q); eq(new Set(ids).size, ids.length, q + " 選項 id 重複"); ok(C.questions[q].prompt.length > 10); eq(C.questions[q].hints.length, 3); });
    QIDS.forEach((q) => { const c = C.questions[q]; if (c.kind === "choice") eq(c.options.length, 4); else { ok(c.pick.objs.every((o) => C.objects[o]), q + " 物件不存在"); ok(c.pick.objs.includes(c.pick.correct)); c.pick.objs.filter((o) => o !== c.pick.correct).forEach((o) => ok(c.pick.why[o], q + "/" + o + " 缺說明")); ok(c.pick.why.release); } });
  });
  T("T12-2 CONFIG：數字合理（秒數、次數、PIN、代碼）", () => {
    ok(C.timing.cooldownMs >= 1000 && C.timing.animMs >= 1000 && C.timing.lockAfter >= 3 && C.timing.holdMs >= 1000); ok(/^\d{4}$/.test(C.masterPin));
    eq(C.link.codes.length, C.groupCodes.length);
  });
  T("T12-3 動畫表：每個會播的動畫都有，數值都在 0～1，只改場景裡有的量", () => {
    const keys = QIDS.concat(["startPrint"]); keys.forEach((k) => ok(Anim.PATCH[k], "缺動畫 " + k)); eq(Anim.ORDER.slice().sort(), keys.slice().sort());
    keys.forEach((k) => [0, 0.25, 0.5, 0.75, 1].forEach((t) => { const p = Anim.PATCH[k](t); Object.keys(p).forEach((n) => { ok(n in Anim.DEFAULT, k + " 動到沒有的量 " + n); ok(p[n] >= 0 && p[n] <= 1 && Number.isFinite(p[n]), k + "." + n + "@" + t + " = " + p[n]); }); }));
  });
  T("T12-4 動畫表：第一格不會跳（t=0 和上一步結束時一致）", () => {
    const hold = (k) => Object.keys(Anim.PATCH[k](0)); // 動畫開始時，只有「從無到有」的量會是 0
    Anim.ORDER.forEach((k) => { const s0 = Anim.stateFor({}, false, k, 0); Object.keys(Anim.PATCH[k](0)).forEach((n) => ok(Number.isFinite(s0[n]))); void hold; });
    const a = Anim.stateFor({ design: true }, false, "design", 1), b = Anim.stateFor({ design: true }, false, null, 1); eq(a, b, "播完的畫面要等於完成後的畫面");
  });
  T("T12-5 動畫表：由存檔還原場景，和一步步播完的結果相同", () => {
    const d = allDone(); const st = Anim.stateFor(d.st.done, d.st.started, null, 1); eq(st.print, 1); eq(st.paint, 1); eq(st.gloss, 1); eq(st.warp, 0); eq(st.level, 1); eq(st.spoolSwap, 1); eq(st.warm, 1);
    const mid = toStep(GATE); mid.ok("plate"); mid.end(); const sm = Anim.stateFor(mid.st.done, mid.st.started, null, 1); eq(sm.level, 1); eq(sm.spoolSwap, 0); eq(sm.warm, 0);
  });
  T("T12-6 動畫表：列印中的翹邊要在「開始列印」後出現、巡檢後消失", () => {
    const afterStart = Anim.stateFor({ design: 1, buy: 1, slice: 1, filament: 1, plate: 1, env: 1 }, true, null, 1); eq(afterStart.warp, 1); ok(afterStart.print > 0 && afterStart.print < 0.3);
    const afterWatch = Anim.stateFor({ design: 1, buy: 1, slice: 1, filament: 1, plate: 1, env: 1, watch: 1 }, true, null, 1); eq(afterWatch.warp, 0); eq(afterWatch.print, 1);
  });

  /* ---------- T13 題庫（A/B/C/D 四套） ---------- */
  const forBanks = (fn) => { try { L.BANK_KEYS.forEach((k) => { L.useBank(k); fn(k, C.banks[k]); }); } finally { L.useBank("A"); } };
  const withBank = (key, seed) => { const s = L.initial(1, seed || 7); s.bank = key; L.useBank(key); return s; };
  T("T13-1 共有 4 套題庫，每套都有全部 9 題、題型與 A 套一致", () => {
    eq(L.BANK_KEYS, ["A", "B", "C", "D"]);
    forBanks((k, b) => { eq(Object.keys(b.questions).sort(), Object.keys(C.banks.A.questions).sort(), k + " 題目清單"); QIDS.forEach((q) => eq(b.questions[q].kind, C.banks.A.questions[q].kind, k + "/" + q + " 題型")); });
  });
  T("T13-2 每套每題只有一個正解；選項 4 個（選擇題）；提示 3 層；放行不是正解", () => {
    forBanks((k) => QIDS.forEach((q) => {
      const c = C.questions[q]; const n = L.optionIds(q).filter((o) => L.isCorrect(q, o)).length; eq(n, 1, k + "/" + q + " 正解數");
      eq(c.hints.length, 3, k + "/" + q + " 提示數"); ok(c.prompt.length > 10 && c.learn.length > 10, k + "/" + q + " 文字");
      if (c.kind === "choice") { eq(c.options.length, 4, k + "/" + q + " 選項數"); c.options.filter((o) => !o.correct).forEach((o) => ok(o.why && o.why.length > 6, k + "/" + q + "/" + o.id + " 缺說明")); }
      else { ok(!L.isCorrect(q, "release")); ok(c.pick.objs.every((o) => C.objects[o])); c.pick.objs.filter((o) => o !== c.pick.correct).concat(["release"]).forEach((o) => ok(c.pick.why[o], k + "/" + q + " 缺 " + o + " 說明")); }
    }));
  });
  T("T13-3 每套的答錯說明與提示都不洩漏答案用字（切片題的選項本來就是同一組參數的變化，選項文字不檢查）", () => {
    forBanks((k) => QIDS.forEach((q) => {
      const keys = C.questions[q].answerKeys;
      L.optionIds(q).filter((o) => !L.isCorrect(q, o)).forEach((o) => keys.forEach((w) => ok(!L.whyOf(q, o).includes(w), k + "/" + q + "/" + o + " 說明洩漏「" + w + "」")));
      if (C.questions[q].kind === "choice" && q !== "slice") C.questions[q].options.filter((o) => !o.correct).forEach((o) => keys.forEach((w) => ok(!o.text.includes(w), k + "/" + q + "/" + o.id + " 選項洩漏「" + w + "」")));
      C.questions[q].hints.forEach((h) => keys.forEach((w) => ok(!h.includes(w), k + "/" + q + " 提示洩漏「" + w + "」")));
    }));
  });
  T("T13-4 每套的檢核讀數：耗材、板子各只有一個異常；環境有異常且平台升不到目標溫度", () => {
    forBanks((k) => {
      eq(L.readings("filament").filter((r) => r.abnormal).length, 1, k + " 耗材異常數"); eq(L.readings("plate").filter((r) => r.abnormal).length, 1, k + " 板子異常數");
      ok(L.readings("env").filter((r) => r.abnormal).length >= 1, k + " 環境異常"); ok(C.env.bedNow < C.env.bedTarget, k + " 平台應升不到目標");
      const v = Object.values(C.plate.gaps); ok(Math.max.apply(null, v) - Math.min.apply(null, v) <= C.plate.tol, k + " 四角間隙應一致");
    });
  });
  T("T13-5 每套都能完整通關，拿到該組代碼", () => {
    L.BANK_KEYS.forEach((k) => {
      const d = drive(withBank(k, 11), T0); d.go({ type: "start" });
      STEPS.forEach((st, i) => { st.qs.forEach((q) => { d.ok(q); d.end(); }); if (st.gate) { d.go({ type: "startPrint" }); d.end(); } });
      ok(d.st.completed && d.st.phase === "done", k + " 應完成"); eq(d.go({ type: "showSuccess" }).success.code, C.groupCodes[0]);
    }); L.useBank("A");
  });
  T("T13-6 每套的答錯：只有該套的正解會前進（窮舉每個選項）", () => {
    L.BANK_KEYS.forEach((k) => {
      QIDS.forEach((q) => {
        const stepIdx = L.consts.stepOfQ[q]; L.useBank(k);
        const d = drive(withBank(k, 11), T0); d.go({ type: "start" });
        for (let i = 0; i < stepIdx; i++) { STEPS[i].qs.forEach((x) => { d.ok(x); d.end(); }); if (STEPS[i].gate) { d.go({ type: "startPrint" }); d.end(); } }
        L.optionIds(q).filter((o) => !L.isCorrect(q, o)).forEach((o) => { const fb = d.go({ type: "answer", qid: q, option: o }); eq(fb.kind, "wrong", k + "/" + q + "/" + o); ok(!d.st.done[q]); });
      });
    }); L.useBank("A");
  });
  T("T13-7 抽題庫：同一種子結果固定；重來不會連續抽到同一套；各套都有機會抽到", () => {
    eq(L.initial(1, 5).bank, L.initial(1, 5).bank); const seen = new Set();
    for (let sd = 1; sd <= 200; sd++) { const s0 = L.initial(1, sd); seen.add(s0.bank); const r = L.reduce(s0, { type: "reset", pin: C.masterPin, seed: sd + 1000 }, T0).state; ok(r.bank !== s0.bank, "重來抽到同一套 " + sd); }
    eq(Array.from(seen).sort(), L.BANK_KEYS); L.useBank("A");
  });
  T("T13-8 存檔還原：題庫保留；亂改題庫代號的存檔無效；舊存檔（沒有題庫欄位）依種子補上", () => {
    L.BANK_KEYS.forEach((k) => { const s = withBank(k, 21); const r = L.restore(L.serialize(s), T0, 5); eq(r.bank, k); });
    const bad = JSON.parse(L.serialize(withBank("B", 21))); bad.bank = "Z"; eq(JSON.stringify(L.restore(JSON.stringify(bad), T0, 5)), JSON.stringify(L.initial(1, 5)));
    const old = JSON.parse(L.serialize(withBank("B", 21))); delete old.bank; eq(L.restore(JSON.stringify(old), T0, 5).bank, L.initial(1, 21).bank); L.useBank("A");
  });
  T("T13-9 換題庫後，檢核的數字跟著換（題目與畫面讀數一致）", () => {
    const e = new Set(); forBanks((k) => e.add(JSON.stringify([C.env, C.fila, C.plate]))); eq(e.size, 4);
    forBanks((k) => { L.readings("filament").forEach((r) => ok(r.value.length > 0)); });
  });
  T("T13-10 切片題：正解要同時把「手的下方」和「身體的下方」都撐起來；只撐一處的選項不能是正解", () => {
    forBanks((k) => { const o = C.questions.slice.options;
      o.filter((x) => x.correct).forEach((x) => ok(/手/.test(x.text) && /身體/.test(x.text) && /支撐開在/.test(x.text), k + " 正解要含手與身體的下方支撐：" + x.text));
      o.filter((x) => !x.correct && /只開在/.test(x.text)).forEach((x) => ok(!/身體/.test(x.text), k + " 只撐一處的選項不該提到身體：" + x.text)); });
  });

  /* ---------- 執行與顯示 ---------- */
  function run() {
    return list.map((t) => { L.useBank("A"); try { t.fn(); return { name: t.name, pass: true }; } catch (e) { return { name: t.name, pass: false, err: String((e && e.message) || e) }; } });
  }
  function render(root) {
    const res = run(); const bad = res.filter((r) => !r.pass).length;
    const box = document.createElement("details"); box.open = true; box.className = "testpanel";
    const sum = document.createElement("summary"); sum.textContent = "自動測試：" + (res.length - bad) + " / " + res.length + " 通過" + (bad ? "（有 " + bad + " 項失敗）" : " ✔"); sum.className = bad ? "bad" : "good";
    box.appendChild(sum);
    const ul = document.createElement("ul");
    res.forEach((r) => { const li = document.createElement("li"); li.className = r.pass ? "good" : "bad"; li.textContent = (r.pass ? "通過 ✔　" : "失敗 ✘　") + r.name + (r.err ? " → " + r.err : ""); ul.appendChild(li); });
    box.appendChild(ul); root.prepend(box); return res;
  }
  return { list, run, render };
})();

<script id="stage">
/* =====================================================================
   3D 場景（CSS 3D，不用外部資源）：把 Anim 算出的狀態畫出來，並處理拖曳旋轉與點選物件
   座標：x 向右、y 向上、z 朝向觀眾；單位是邏輯像素
   ===================================================================== */
const Stage = (() => {
  "use strict";
  const W = 560, H = 420;
  const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
  const lerp = (a, b, t) => a + (b - a) * t;
  const sm = (t) => t * t * (3 - 2 * t);
  const seg = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
  const hex = (h) => { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
  const mixHex = (a, b, k) => { const A = hex(a), B = hex(b); return "rgb(" + [0, 1, 2].map((i) => Math.round(lerp(A[i], B[i], k))).join(",") + ")"; };
  const RM = () => !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);

  /* ---------- 積木：長方體（原點在底面中心）---------- */
  function cuboid(parent, w, h, d, o) {
    o = o || {};
    const el = document.createElement("div"); el.className = "cb" + (o.cls ? " " + o.cls : "");
    if (o.color) el.style.setProperty("--c", o.color);
    if (o.obj) { el.dataset.obj = o.obj; el.classList.add("obj"); }
    const faces = [
      ["front", w, h, -w / 2, -h, "translateZ(" + d / 2 + "px)"],
      ["back", w, h, -w / 2, -h, "rotateY(180deg) translateZ(" + d / 2 + "px)"],
      ["right", d, h, -d / 2, -h, "rotateY(90deg) translateZ(" + w / 2 + "px)"],
      ["left", d, h, -d / 2, -h, "rotateY(-90deg) translateZ(" + w / 2 + "px)"],
      ["top", w, d, -w / 2, -h - d / 2, "rotateX(90deg)"],
      ["bottom", w, d, -w / 2, -d / 2, "rotateX(-90deg)"]
    ];
    const fe = {};
    faces.forEach((f) => {
      const x = document.createElement("div"); x.className = "f " + f[0];
      x.style.width = f[1] + "px"; x.style.height = f[2] + "px"; x.style.left = f[3] + "px"; x.style.top = f[4] + "px"; x.style.transform = f[5];
      if (o.html && o.html[f[0]]) x.innerHTML = o.html[f[0]];
      el.appendChild(x); fe[f[0]] = x;
    });
    if (parent) parent.appendChild(el);
    return { el, faces: fe, w, h, d };
  }
  /* 單層水平薄片（只有一個面，畫起來比整塊輕） */
  function plane(parent, w, d, cls, color) {
    const el = document.createElement("div"); el.className = "cb pl" + (cls ? " " + cls : ""); if (color) el.style.setProperty("--c", color);
    const f = document.createElement("div"); f.className = "f pf"; f.style.width = w + "px"; f.style.height = d + "px"; f.style.left = -w / 2 + "px"; f.style.top = -d / 2 + "px"; f.style.transform = "rotateX(90deg)";
    el.appendChild(f); if (parent) parent.appendChild(el); return { el, faces: { top: f }, w, h: 0, d };
  }
  const group = (parent, cls) => { const el = document.createElement("div"); el.className = "grp" + (cls ? " " + cls : ""); if (parent) parent.appendChild(el); return el; };
  const put = (n, x, y, z, extra) => { n.style.transform = "translate3d(" + x.toFixed(2) + "px," + (-y).toFixed(2) + "px," + z.toFixed(2) + "px)" + (extra || ""); };
  const vis = (n, v) => { const d = v ? "" : "none"; if (n.style.display !== d) n.style.display = d; };

  /* ---------- 公仔的零件表（y 為底、h 為高）---------- */
  const FIG = [
    { id: "footL", x: -10, z: 3, w: 15, h: 8, d: 20, y: 0, col: "shoe", pg: 0 },
    { id: "footR", x: 10, z: 3, w: 15, h: 8, d: 20, y: 0, col: "shoe", pg: 0 },
    { id: "legL", x: -10, z: 0, w: 11, h: 18, d: 12, y: 8, col: "pants", pg: 0 },
    { id: "legR", x: 10, z: 0, w: 11, h: 18, d: 12, y: 8, col: "pants", pg: 0 },
    { id: "body", x: 0, z: 0, w: 40, h: 30, d: 26, y: 26, col: "shirt", pg: 1 },
    { id: "armL", x: -27, z: 0, w: 10, h: 26, d: 12, y: 28, col: "shirt", pg: 1 },
    { id: "armR", x: 27, z: 0, w: 10, h: 26, d: 12, y: 28, col: "shirt", pg: 1 },
    { id: "head", x: 0, z: 0, w: 36, h: 28, d: 32, y: 56, col: "skin", pg: 2 },
    { id: "cap", x: 0, z: 0, w: 38, h: 8, d: 34, y: 84, col: "cap", pg: 3 },
    { id: "brim", x: 0, z: 2, w: 52, h: 3, d: 50, y: 82, col: "cap", pg: 3 }
  ];
  /* 支撐：手臂下面 4 根（x=±27）＋身體突出處下面 4 根（x=±17.5），都從平台往上長 */
  const SUPP = [[-27, -4, 28], [-27, 4, 28], [27, -4, 28], [27, 4, 28], [-17.5, -7, 26], [-17.5, 7, 26], [17.5, -7, 26], [17.5, 7, 26]].map((p, i) => ({ id: "s" + i, x: p[0], z: p[1], w: 3.5, h: p[2], d: 3.5, y: 0 }));
  const FH = 92;                         // 公仔總高
  const PAL = { raw: "#d9dee9", sanded: "#eef1f7", primer: "#a9b2c6", shoe: "#243a6e", pants: "#2f56a8", shirt: "#3b82f6", skin: "#ffd3a3", cap: "#ff8a1f" };
  const PAINT_AT = [[0.28, 0.42], [0.42, 0.58], [0.58, 0.74], [0.74, 0.88]];
  const BED_Y = 46;                      // 平台表面高度
  const REST = { x: -78, y: 0, z: 108 }; // 取下後成品放在桌上的位置

  function create(root) {
    root.classList.add("stage3d");
    root.innerHTML = "";
    const vp = group(root, "vp"), cam = group(vp, "cam"), world = group(cam, "world");
    const R = { root, vp, cam, world };

    /* 桌面與牆 */
    cuboid(world, 470, 18, 330, { cls: "table", color: "#6b4f3a" }).el.style.transform = "translate3d(0px,18px,0px)";
    const wall = cuboid(world, 480, 250, 6, { cls: "wall", color: "#16305a" }); put(wall.el, 0, 0, -150);
    const win = cuboid(world, 120, 92, 3, { cls: "win", color: "#a9d9ff" }); put(win.el, 140, 76, -146);
    const thermo = cuboid(world, 34, 96, 3, { cls: "thermo", color: "#e8eefb", html: { front: '<div class="th"><i></i><b>' + CONFIG.env.room + '℃</b></div>' } }); put(thermo.el, -150, 74, -146);

    /* 印表機 */
    const printer = group(world, "printer"); R.printer = printer;
    cuboid(printer, 250, 40, 210, { cls: "pbase", color: "#2c5aa0" });
    const screen = cuboid(printer, 74, 46, 6, { cls: "screen", color: "#10233f", obj: "screen", html: { front: '<div class="scr"><b data-k="n">噴頭 25℃</b><b data-k="b">平台 38℃</b><i>PLA</i></div>' } });
    put(screen.el, 78, 0, 118, " rotateX(-18deg)"); R.scr = screen.faces.front;
    [-112, 112].forEach((x) => { const p = cuboid(printer, 12, 150, 14, { cls: "pillar", color: "#3b6fb6" }); put(p.el, x, 40, 0); });
    R.bedG = group(printer, "bedg");
    R.bed = cuboid(R.bedG, 176, 6, 156, { cls: "bed", color: "#4a5b7a", obj: "bed" }); put(R.bed.el, 0, 40, 0);
    R.knobs = [[-70, 62], [70, 62], [-70, -62], [70, -62]].map((p) => { const k = cuboid(R.bedG, 14, 8, 14, { cls: "knob", color: "#ffb347", obj: "knob" }); put(k.el, p[0], 34, p[1]); return k; });
    R.bar = cuboid(printer, 236, 12, 12, { cls: "bar", color: "#4a82d0" });
    R.car = cuboid(printer, 38, 26, 26, { cls: "car", color: "#5b93e0", obj: "nozzle" });
    R.fan = cuboid(printer, 16, 16, 16, { cls: "fan", color: "#e8eefb", obj: "fan" });
    R.tip = cuboid(printer, 9, 9, 9, { cls: "tip", color: "#ff8a1f", obj: "nozzle" });

    /* 線材卷架與線材 */
    const post = cuboid(world, 8, 100, 8, { cls: "post", color: "#3b6fb6" }); put(post.el, 150, 0, -40);
    const axle = cuboid(world, 6, 6, 52, { cls: "axle", color: "#8aa4d0" }); put(axle.el, 150, 98, -40);
    R.holder = { x: 150, y: 101, z: -40 };
    function spool(radius, fill, col) {
      const g = group(world, "spool"); g.dataset.obj = "spool"; g.classList.add("obj");
      const mk = (r, z, c, cls) => { const d = document.createElement("div"); d.className = "disc " + (cls || ""); d.style.width = d.style.height = r * 2 + "px"; d.style.left = d.style.top = -r + "px"; d.style.transform = "translateZ(" + z + "px)"; d.style.background = c; g.appendChild(d); return d; };
      for (let z = -9; z <= 9; z += 3) mk(fill, z, col, "wire");
      mk(radius, -12, "#cfd8ea", "flange"); mk(radius, 12, "#cfd8ea", "flange"); mk(12, 14, "#8aa4d0", "hub");
      const mark = document.createElement("div"); mark.className = "mark"; mark.style.transform = "translateZ(13px) translateY(" + -(radius - 8) + "px)"; g.appendChild(mark);
      return g;
    }

    good() { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.2, "triangle", 0.14, i * 0.11)); },
    bad() { this.tone(190, 0.3, "sawtooth", 0.12); this.tone(140, 0.34, "sawtooth", 0.12, 0.17); },
    whirr() { [220, 260, 300, 340].forEach((f, i) => this.tone(f, 0.12, "square", 0.04, i * 0.1)); }
  };
  document.addEventListener("pointerdown", () => Snd.init(), { capture: true });
  const buzz = (ms) => { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) { /* 忽略 */ } };
  let toastTimer = 0;
  function toast(text, kind) {
    const t = $("#toast"); t.textContent = text; t.className = kind || ""; t.classList.remove("hidden");
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.add("hidden"), 3200);
  }

  function dispatch(a, quiet) {
    const r = L.reduce(state, a, Date.now());
    if (r.state !== state) { state = r.state; persist(); }
    if (!quiet) render();
    return r.fb;
  }

  /* ---------- 鏡頭與場景 ---------- */
  const camKey = () => state.phase === "intro" ? "intro" : state.phase === "done" ? "done" : (STEPS[state.step].gate ? (focusQ || firstOpenQ()) : STEPS[state.step].qs[0]);
  const firstOpenQ = () => STEPS[state.step].qs.find((q) => !state.done[q]) || STEPS[state.step].qs[0];
  function sceneNow(clk, extra) {
    if (!R) return;
    const S = Anim.stateFor(state.done, state.started, null, 1);
    Stage.render(R, S, Object.assign({ clk: clk || 0, spin: state.phase === "done" && !RM() }, extra || {}));
  }
  function ensureStage() {
    if (!stageHost) {
      stageHost = el("div", { class: "stagewrap" });
      const root = el("div", { class: "stage3d", role: "img", "aria-label": "3D 列印工作檯：可以用手指或滑鼠拖曳旋轉" });
      const tools = el("div", { class: "stagetools" },
        el("button", { class: "btn ghost small", title: "回到這一步的重點視角", onclick: () => { Stage.focus(R, camKey()); } }, "🎯 重點視角"),
        el("button", { class: "btn ghost small", "aria-label": "放大", onclick: () => Stage.zoom(R, 1.2) }, "＋"),
        el("button", { class: "btn ghost small", "aria-label": "縮小", onclick: () => Stage.zoom(R, 1 / 1.2) }, "－"));
      stageHost.append(root, tools, el("p", { class: "sub stagehint" }, "拖曳可以旋轉；點物件可以選取。"));
      R = Stage.create(root); R.onPick = onPickObj;
      Stage.focus(R, camKey(), true);
    }
    return stageHost;
  }
  function onPickObj(obj) {
    if (state.phase !== "play" || anim) return;
    const q = pickQuestion();
    if (q && C.questions[q].pick.objs.includes(obj)) { answer(q, obj); return; }
    toast("這是「" + C.objects[obj].name + "」", "info");
  }
  const pickQuestion = () => { const qs = STEPS[state.step].qs; const f = focusQ && qs.includes(focusQ) && !state.done[focusQ] ? focusQ : qs.find((q) => !state.done[q]); return f && C.questions[f].kind === "pick" ? f : null; };

  /* ---------- 動畫 ---------- */
  function playAnim(key, onDone) {
    const dur = (C.timing.animMs * (Anim.DUR[key] || 1));
    const printing = key === "startPrint" || key === "watch";
    if (RM()) { sceneNow(0); setTimeout(onDone, 800); anim = { rm: true }; return; }
    const t0 = performance.now(); const h = { raf: 0 }; anim = h; Snd.whirr();
    const frame = (now) => {
      const t = Math.min(1, (now - t0) / dur);
      Stage.render(R, Anim.stateFor(state.done, state.started, key, t), { clk: (now - t0) / 1000, printing: printing && t > 0 && t < 1 });
      if (t < 1) h.raf = requestAnimationFrame(frame); else setTimeout(onDone, 350);
    };
    h.raf = requestAnimationFrame(frame);
  }
  function afterAnim() {
    anim = null; const fb = dispatch({ type: "animEnd" }, true);
    if (state.phase === "done") { Snd.good(); }
    focusQ = null; hintPhaseKey = ""; hideHint(); render(); Stage.focus(R, camKey());
    sceneNow(0); void fb;
  }

  /* ---------- 通用元件 ---------- */
  const msgBox = (key) => { const m = msgs[key]; return el("div", { class: "msg " + (m ? m.kind : ""), id: "msg-" + key, role: "status", "aria-live": "polite" }, m ? m.text : ""); };
  function setMsg(key, text, kind) { msgs[key] = text ? { text, kind } : null; const b = $("#msg-" + key); if (b) { b.className = "msg " + (kind || ""); b.textContent = text || ""; } }
  const busy = () => state.animating || !!anim;
  const cdLeft = () => L.cooldownLeft(state, Date.now());
  const dis = () => busy() || state.locked || cdLeft() > 0;

  function answer(qid, opt) {
    if (busy()) return; Snd.click();
    if (STEPS[state.step].qs.indexOf(qid) < 0 || state.done[qid]) return;
    const fb = dispatch({ type: "answer", qid, option: opt }, true);
    if (!fb.ok) {
      if (fb.kind === "cooldown") toast(C.msg.cooling.replace("{n}", Math.ceil(fb.leftMs / 1000)), "info");
      chrome(); return;
    }
    if (fb.kind === "wrong") {
      Snd.bad(); buzz(150); (picked[qid] = picked[qid] || {})[opt] = true;
      setMsg(qid, C.msg.wrongHead + fb.text, "bad");
      if (fb.lockedNow) toast("機器暫停，請找關主", "bad");
      render(); return;
    }
    Snd.good(); learn = { qid, text: fb.learn };
    setMsg(qid, "", ""); render();                       // 讓畫面進入「動畫中」狀態（按鈕鎖定）
    $("#main").classList.add("busyview");
    playAnim(fb.anim, afterAnim);
  }
  function onGate() {
    if (busy()) return; Snd.click();
    const fb = dispatch({ type: "startPrint" }, true);
    if (!fb.ok) { if (fb.kind === "needChecks") toast(C.gate.locked, "info"); chrome(); return; }
    learn = null; render(); Stage.focus(R, "startPrint"); playAnim("startPrint", afterAnim);
  }

  /* ---------- 各畫面 ---------- */
  function readingsTable(qid) {
    return el("table", { class: "readings" }, el("tbody", {}, L.readings(qid).map((r) => el("tr", {}, el("th", {}, r.label), el("td", {}, r.value)))));
  }
  function questionCard(qid, opts) {
    const q = C.questions[qid], done = !!state.done[qid], active = opts && opts.active;
    if (done) return el("div", { class: "qcard done" }, el("b", {}, "✔ " + q.title + "　已通過"));
    const chosen = picked[qid] || {};
    const body = [el("p", { class: "prompt" }, q.prompt)];
    if (q.readings) body.push(readingsTable(qid));
    body.push(el("div", { class: "reasons" }, L.optionsOf(state, qid).map((o) =>
      el("button", { class: "opt" + (chosen[o.id] ? " wrong" : "") + (q.kind === "pick" ? " pickopt" : ""), "data-q": qid, "data-o": o.id, disabled: dis(), onclick: () => answer(qid, o.id) },
        q.kind === "pick" && o.id !== "release" ? "👆 " + o.text : o.text))));
    body.push(msgBox(qid));
    return el("div", { class: "qcard" + (active ? " active" : ""), onclick: () => { if (focusQ !== qid && !anim) { focusQ = qid; Stage.focus(R, qid); hintPhaseKey = ""; render(); } } },
      el("h3", {}, q.title), body);
  }
  function viewIntro() {
    const linked = state.linked;
    const input = el("input", { type: "text", inputmode: "numeric", maxlength: "3", id: "linkcode", placeholder: "第一關的 3 位數代碼", "aria-label": "第一關的代碼", autocomplete: "off" });
    const doLink = () => {
      Snd.click(); const fb = dispatch({ type: "link", code: input.value }, true);
      if (fb.ok) { linkMsg = { text: C.story.linkOk + "（已帶入第 " + fb.group + " 組）", kind: "good" }; render(); }
      else { linkMsg = { text: fb.kind === "badCode" ? "這個代碼不是第一關的代碼，請再確認一次（也可以略過，直接開始）。" : "目前不能輸入。", kind: "bad" }; render(); }
    };
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") doLink(); });
    return el("div", { class: "panel pop" },
      el("h2", {}, C.title + "：" + C.subtitle), artImg("s2_figure_color", "hero", "校園形象公仔"), para(C.story.intro),
      el("div", { class: "setting" }, el("b", {}, "第一關過關了嗎？（選填）"),
        linked ? el("div", { class: "msg good" }, C.story.linkOk + "（第 " + state.group + " 組）") : el("div", { class: "row" }, input, el("button", { class: "btn small", onclick: doLink }, "確認")),
        !linked && linkMsg ? el("div", { class: "msg " + linkMsg.kind }, linkMsg.text) : null),
      el("button", { class: "btn big", id: "btnStart", onclick: () => { Snd.click(); dispatch({ type: "start" }); Stage.focus(R, camKey()); } }, "開始"));
  }
  function viewPlay() {
    const st = STEPS[state.step];
    const fq = focusQ && st.qs.includes(focusQ) && !state.done[focusQ] ? focusQ : firstOpenQ();
    const right = [];
    right.push(el("h2", {}, st.title));
    { const im = artImg("s2_step_" + st.id, "banner", st.title); if (im) right.push(im); }
    if (learn && !anim) right.push(el("div", { class: "note-box learn" }, el("b", {}, "💡 上一步學到的："), learn.text));
    if (st.gate) {
      right.push(para("三項都要檢查，三項都通過才能開始列印。（可以點卡片切換，也可以直接點 3D 場景裡的物件。）", "sub"));
      st.qs.forEach((q) => right.push(questionCard(q, { active: q === fq && !state.done[q] })));
      const miss = L.missingChecks(state);
      right.push(el("button", { class: "btn big green", id: "btnGate", disabled: miss.length > 0 || dis(), onclick: onGate }, C.gate.label));
      right.push(para(miss.length ? C.gate.locked + "（還差 " + miss.length + " 項）" : C.gate.doneMsg, "sub"));
    } else st.qs.forEach((q) => right.push(questionCard(q, { active: true })));
    return el("div", { class: "panel grid2 pop" }, el("div", { class: "stickycol" }, ensureStage()), el("div", {}, right));
  }
  function viewDone() {
    const info = L.successInfo(state);
    const rev = el("details", { class: "panel", style: "margin-top:10px" }, el("summary", { style: "font-weight:800;cursor:pointer" }, "想一想（選做）：把剛剛學到的說出來"),
      C.review.map((q, qi) => { const out = el("div", { class: "msg" });
        return el("div", { class: "setting", style: "margin-top:10px" }, el("b", {}, (qi + 1) + ". " + q.q),
          el("div", { class: "reasons" }, L.reviewOptions(state, qi).map((o) => el("button", { class: "opt", onclick: (ev) => {
            const fb = dispatch({ type: "review", q: qi, option: o.id }, true); Snd.click();
            ev.target.parentNode.querySelectorAll(".opt").forEach((b) => b.classList.remove("good", "wrong")); ev.target.classList.add(fb.correct ? "good" : "wrong");
            out.className = "msg " + (fb.correct ? "good" : "bad"); out.textContent = fb.text;
          } }, o.text))), out);
      }));
    const replay = el("button", { class: "btn ghost", id: "btnReplay", disabled: busy(), onclick: () => { if (busy()) return; const fb = dispatch({ type: "replay" }, true); if (!fb.ok) return; render(); playAnim("paint", () => { anim = null; dispatch({ type: "animEnd" }, true); render(); sceneNow(0); }); } }, "🔁 重播上色動畫");
    const panel = el("div", { class: "panel pop", style: "border-color:var(--green)" },
      el("h2", {}, "✔ 公仔完成！"), artImg("s2_figure_color", "hero", "上色完成的公仔"), para(info.story),
      el("div", { class: "codebox" }, el("div", { class: "sub" }, info.label), el("div", { class: "code" }, info.code)),
      para(info.next), replay, rev);
    return el("div", {}, panel, el("div", { style: "height:10px" }), el("div", { class: "panel" }, ensureStage()));
  }
  function view() {
    switch (state.phase) {
      case "intro": return el("div", { class: "grid2" }, el("div", { class: "panel stickycol" }, ensureStage()), viewIntro());
      case "play": return viewPlay();
      default: return viewDone();
    }
  }

  /* ---------- 外框 ---------- */
  function chrome() {
    const cur = state.phase === "done" ? STEPS.length : (state.phase === "intro" ? -1 : state.step);
    $("#chips").replaceChildren(...STEPS.map((s, i) => el("span", { class: "chip" + (i === cur ? " on" : (i < cur ? " fin" : "")) }, (i < cur ? "✓ " : (i + 1) + " ") + s.short)));
    $("#grp").textContent = "第 " + state.group + " 組"; $("#donebadge").classList.toggle("hidden", !state.completed);
    const hb = $("#hintbtn"); const hq = state.phase === "play" ? (STEPS[state.step].gate ? (focusQ && !state.done[focusQ] ? focusQ : firstOpenQ()) : STEPS[state.step].qs[0]) : null;
    const show = hq && !state.done[hq]; hb.classList.toggle("hidden", !show); if (show) hb.textContent = "💡 提示（已看 " + state.hintSeen[hq] + "/3 層）";
    $("#info").textContent = "第 " + state.group + " 組 · 答錯 " + state.failCount + " 次 · 提示 " + state.hintsUsed + " 次";
    const lock = $("#lock"); const showLock = state.locked && !anim && !state.animating; lock.classList.toggle("hidden", !showLock);
    if (showLock) $("#lockmsg").textContent = C.msg.lock.replace("{n}", C.timing.lockAfter);
    updateBtns();
  }
  function updateBtns() {
    const left = cdLeft(), d = dis();
    document.querySelectorAll(".opt[data-q]").forEach((b) => { b.disabled = d; });
    const g = $("#btnGate"); if (g) g.disabled = L.missingChecks(state).length > 0 || busy() || state.locked;
    const cd = $("#cdline"); if (cd) { cd.textContent = left > 0 && !busy() ? C.msg.cooling.replace("{n}", Math.ceil(left / 1000)) : ""; }
  }
  function render() {
    chrome(); if (anim) return;
    const main = $("#main"); const keep = stageHost && stageHost.parentNode;
    if (keep) keep.removeChild(stageHost);
    main.classList.remove("busyview"); main.replaceChildren(view());
    if (state.phase === "play" && !$("#cdline")) { /* 冷卻提示列放在面板最上面 */ const p = $("#main .panel"); if (p) p.prepend(el("div", { id: "cdline", class: "cdline", role: "status" })); }
    sceneNow(0); chrome();
    const k = state.phase + ":" + state.step + ":" + (focusQ || ""); if (k !== hintPhaseKey) { hintPhaseKey = k; hideHint(); }
  }

  /* ---------- 提示 ---------- */
  function hideHint() { const s = $("#hintsheet"); if (s) s.classList.add("hidden"); }
  function onHint() {
    Snd.click(); const qid = state.phase === "play" ? (STEPS[state.step].gate ? (focusQ && !state.done[focusQ] ? focusQ : firstOpenQ()) : STEPS[state.step].qs[0]) : null;
    if (!qid) return; const fb = dispatch({ type: "hint", qid }, true); chrome(); if (!fb.ok) return;
    const s = $("#hintsheet"); s.replaceChildren(el("div", { class: "row spread" }, el("span", { class: "lv" }, "💡 提示　第 " + fb.level + " / 3 層"), el("button", { class: "btn ghost small", onclick: hideHint }, "關閉")), el("p", { style: "margin:6px 0 0;font-size:20px" }, fb.text));
    s.classList.remove("hidden");
  }

  /* ---------- 關主：長按 3 秒 → PIN → 面板 ---------- */
  function makeHold(btn) {
    let timer = 0, raf = 0, t0 = 0; const ring = btn.querySelector(".ring");
    const stop = () => { clearTimeout(timer); cancelAnimationFrame(raf); timer = 0; if (ring) ring.style.setProperty("--p", "0deg"); };
    btn.style.touchAction = "none";
    btn.addEventListener("contextmenu", (e) => e.preventDefault());
    btn.addEventListener("pointerdown", (e) => {
      e.preventDefault(); Snd.init(); t0 = performance.now();
      const step = () => { const p = Math.min(1, (performance.now() - t0) / C.timing.holdMs); if (ring) ring.style.setProperty("--p", p * 360 + "deg"); if (p < 1) raf = requestAnimationFrame(step); };
      step(); timer = setTimeout(() => { stop(); openPin(); }, C.timing.holdMs);
    });
    ["pointerup", "pointerleave", "pointercancel"].forEach((ev) => btn.addEventListener(ev, () => { if (timer) { stop(); toast("關主專用：要長按 " + Math.round(C.timing.holdMs / 1000) + " 秒", "info"); } }));
  }
  let wrongPins = 0, pinBlockUntil = 0;
  function closeOverlay() { const o = $("#adm"); o.classList.add("hidden"); o.replaceChildren(); }
  function openPin() {
    let pin = ""; const o = $("#adm"); o.classList.remove("hidden");
    const dots = el("div", { class: "pindots" }, ""); const info = el("div", { class: "msg" });
    const upd = () => { dots.textContent = "●".repeat(pin.length) + "○".repeat(Math.max(0, 4 - pin.length)); };
    const submit = () => {
      if (Date.now() < pinBlockUntil) { info.className = "msg bad"; info.textContent = "輸入錯誤太多次，請 " + Math.ceil((pinBlockUntil - Date.now()) / 1000) + " 秒後再試"; return; }
      if (L.checkPin(pin)) { wrongPins = 0; openAdmin(pin); return; }
      wrongPins++; pin = ""; upd(); info.className = "msg bad"; info.textContent = "PIN 不正確"; $("#adm .box").classList.remove("shake"); void $("#adm .box").offsetWidth; $("#adm .box").classList.add("shake");
      if (wrongPins >= 3) { pinBlockUntil = Date.now() + 30000; wrongPins = 0; info.textContent = "連續錯誤 3 次，鎖定 30 秒"; }
    };
    const keys = ["1", "2", "3", "4", "5", "6", "7", "8", "9", "⌫", "0", "確定"].map((k) => el("button", { onclick: () => {
      if (k === "⌫") pin = pin.slice(0, -1); else if (k === "確定") { submit(); return; } else if (pin.length < 4) pin += k; upd(); if (pin.length === 4 && k !== "⌫") submit();
    } }, k));
    o.replaceChildren(el("div", { class: "box" }, el("h2", {}, "關主驗證"), para("請輸入 4 位數 PIN", "sub"), dots, el("div", { class: "keypad" }, keys), info, el("button", { class: "btn ghost", onclick: closeOverlay }, "取消")));
    upd();
  }
  function openAdmin(pin) {
    let g = Math.min(C.groupCodes.length, state.group + 1);
    const o = $("#adm"); const out = el("output", {}, String(g)); const codeLine = el("div", { class: "sub" });
    const upd = () => { out.textContent = String(g); codeLine.textContent = "第 " + g + " 組的過關代碼：" + L.codeFor(g); };
    const step = (d) => { g = Math.max(1, Math.min(C.groupCodes.length, g + d)); upd(); };
    const doUnlock = () => { const fb = dispatch({ type: "unlock", pin }, true); if (fb.ok) { toast("已解鎖，可以繼續", "good"); closeOverlay(); render(); } };
    const doReset = () => {
      const fb = dispatch({ type: "reset", pin, group: g, seed: newSeed() }, true);
      if (fb.ok) { store.del(); persist(); msgs = {}; picked = {}; learn = null; anim = null; focusQ = null; linkMsg = null; hintPhaseKey = ""; closeOverlay(); hideHint(); render(); Stage.focus(R, camKey(), true); toast("已重來，換第 " + state.group + " 組、題庫 " + CONFIG.banks[state.bank].label, "good"); }
    };
    o.replaceChildren(el("div", { class: "box" }, el("h2", {}, "關主面板"),
      el("p", { class: "sub" }, "目前：第 " + state.group + " 組 · 題庫 " + CONFIG.banks[state.bank].label + " · 答錯 " + state.failCount + " 次 · 提示 " + state.hintsUsed + " 次" + (state.locked ? " · 已鎖機" : "") + (state.completed ? " · 已完成" : "")),
      state.locked ? el("button", { class: "btn big green", onclick: doUnlock }, "解鎖機器（讓這組繼續）") : null,
      el("hr", { style: "border-color:var(--line);margin:14px 0" }),
      el("b", {}, "重來，並換到下一組"), el("div", { class: "stepper" }, el("button", { onclick: () => step(-1) }, "−"), out, el("button", { onclick: () => step(1) }, "＋")), codeLine,
      el("button", { class: "btn big", style: "margin-top:8px", onclick: doReset }, "重來（全部清空）"),
      el("button", { class: "btn ghost", style: "margin-top:10px;width:100%", onclick: closeOverlay }, "關閉")));
    upd();
  }

  /* ---------- 啟動 ---------- */
  function boot() {
    document.title = C.title + "｜" + C.subtitle;
    $("#brandT").textContent = C.title; $("#brandS").textContent = C.subtitle;
    $("#hintbtn").addEventListener("click", onHint);
    makeHold($("#gear")); makeHold($("#lockhold"));
    /* 從第一關按「前往第二關」進來時，網址會帶 #code=密碼，自動確認 */
    try { const m = /[#?&]code=(\d{3})/.exec(location.hash + location.search);
      if (m && state.phase === "intro" && !state.linked) { const fb = dispatch({ type: "link", code: m[1] }, true); linkMsg = fb.ok ? { text: C.story.linkOk + "（已從第一關帶入第 " + fb.group + " 組）", kind: "good" } : { text: "網址帶來的密碼不是第一關的代碼，請在下面重新輸入。", kind: "bad" }; } } catch (e) {}
    render();
    setInterval(updateBtns, 250);
    /* 閒置時讓冷風、公仔慢慢動；動畫播放中、或使用者設定減少動態時不跑 */
    idleTimer = setInterval(() => { if (anim || RM() || document.hidden || !R) return; const S = Anim.stateFor(state.done, state.started, null, 1); if (S.warm < 1 || state.phase === "done") sceneNow(performance.now() / 1000); }, 70);
    if (/(^|[?&])test=1(&|$)/.test(location.search)) Tests.render($("#app"));
  }
  boot();
})();

</script>
</body>
