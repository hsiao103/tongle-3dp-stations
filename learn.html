(function (g) {

    </ol>
    <details class="box" style="margin-top:18px"><summary style="cursor:pointer;font-weight:800;min-height:44px;display:flex;align-items:center">之後會用到：Bambu Studio 切片、機型範圍與資源連結（點開）</summary><p>前兩節你在紙上標出了懸空、支撐和底座。這一節，換成讓<b>切片軟體</b>幫你檢查。切片就是把模型「切」成一層層的路徑，再加入溫度、速度、支撐等設定，變成印表機看得懂的指令。</p>
    <div class="box">學校的印表機有 <b>A1 mini、A1、H2S、X2D</b>，都是拓竹（Bambu Lab）的機型，所以我們用 <b>Bambu Studio</b>。各機型的選單位置、版本畫面可能略有不同，但下面四個動作每一款都有。</div>

      <li><b class="n">支撐</b><br>打開支撐，看軟體幫你加在哪裡。<br><span class="hint">對照：軟體加支撐的地方，和你畫的紅圈「懸空」是同一處嗎？有沒有你沒想到的地方？</span>${ck("a3", "我把軟體的支撐和自己的標記對照過了")}</li>
      <li><b class="n">預覽</b><br>一層一層往上看，不用真的開印也能先找出問題。<br><span class="hint">檢查：懸空處有支撐嗎？底座夠寬嗎？預估的時間和用料是多少？</span>${ck("a4", "我看完預覽，並寫下一個發現")}</li>

    <label class="f" for="s3-note">我在預覽裡的發現（例如：原來這裡也要支撐）</label><textarea id="s3-note" maxlength="160">${esc(c.note || "")}</textarea>
    <div class="box warn"><b>層高</b>是每一層的厚度。層高越小，細節越漂亮，但時間越久；層高越大，印得快，但表面比較粗。遊戲裡學過的「參數」，在這裡可以親手調。</div>
    <h3>手機版怎麼學？</h3>
    <div class="box"><b>Bambu Handy 是遠端控制與監看印表機的手機 App，不是切片軟體。</b>切片要在電腦版 Bambu Studio 做。<br>Handy 能做的事：看列印進度、管理印表機、重印做過的專案。要綁定印表機必須登入帳號，而且需要網路。</div>

      <tr><td>匯入、擺放、加支撐、預覽</td><td>✅</td><td>—</td></tr><tr><td>看印表機進度</td><td>✅</td><td>✅（需登入、連網）</td></tr><tr><td>課堂上自己動手練習</td><td>✅ 建議</td><td>用來看示範、查資料</td></tr></table>

    <p>印表機一次能印出來的最大空間，用「長 × 寬 × 高」（x × y × z，單位 mm）表示。你的公仔放不放得進去，要先看這個。</p>

    $$("[data-go]", $("#t3")).forEach((b) => b.onclick = () => tab(b.dataset.go));

        const PR = [["A1 mini", 180, 180, 180], ["A1", 256, 256, 256], ["H2S", 340, 320, 340], ["X2D", 256, 256, 260]];

  /* ---------- 作品卡 ---------- */
  const okLink = (u) => /^https:\/\/[^\s]+$/i.test(String(u || "").trim());
  function shrink(file, cb) { const r = new FileReader(); r.onload = () => { const im = new Image(); im.onload = () => { const m = 720, k = Math.min(1, m / Math.max(im.width, im.height)), c = document.createElement("canvas"); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k); const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); g.drawImage(im, 0, 0, c.width, c.height); cb(c.toDataURL("image/jpeg", 0.86)); }; im.onerror = () => cb(null); im.src = r.result; }; r.onerror = () => cb(null); r.readAsDataURL(file); }
  function renderOut() {
    const w = S.w, solved = T.q.filter((q, i) => S.solved[i]).length, n3 = ["s1", "s2", "s3", "s4", "s5"].filter((k) => S.s3[k]).length;

      <div style="margin-top:6px"><label class="sec" style="display:inline-block;border:2px solid var(--navy);border-radius:12px;padding:9px 14px;font-weight:700;cursor:pointer;min-height:44px">選擇圖片<input type="file" accept="image/*" data-img="${k}" style="position:absolute;opacity:0;width:1px;height:1px"></label>${w[k] ? ` <button class="sec" data-delimg="${k}">移除</button>` : ""}</div></div>`;
    $("#t4").innerHTML = `<h2>我的作品卡</h2><p>把這次的創作整理成一張作品卡，存成檔案交給老師。檔案只存在這台裝置，你按下載才會產生。</p>
    <div class="card"><div class="k">${esc(ID.cls)} 班 ${esc(ID.seat)} 號 ${esc(S.name)}</div><div class="v">${esc(w.topic || "（還沒填主題）")}</div><div class="hint">AI 實作 ${n3} / 5　回顧三問 ${solved} / 3　草圖：${S.draw ? "已畫" : "還沒畫"}</div></div>
    <label class="f" for="o-topic">主題（我的作品是什麼？）</label><input type="text" id="o-topic" maxlength="30" value="${esc(w.topic || "")}" placeholder="例如：射門的小橘隊長">
    <label class="f" for="o-idea">理念（我為什麼這樣設計？跟 3D 列印有什麼關係？）</label><textarea id="o-idea" maxlength="240" placeholder="可以寫：我選這個動作的原因、哪裡是懸空處、我怎麼處理底座或支撐">${esc(w.idea || "")}</textarea>
    <label class="f" for="o-link">作品連結（把 Tripo 的分享連結貼在這裡）</label><input type="text" id="o-link" maxlength="300" inputmode="url" value="${esc(w.link || "")}" placeholder="https://…">
    <div class="hint" id="o-linkmsg">${w.link ? (okLink(w.link) ? "✅ 連結格式正確" : "⚠️ 連結要以 https:// 開頭") : "老師有付費版，可以幫你輸出模型，輸出後把連結貼在這裡。"}</div>
    <div class="row" style="margin-top:6px">${imgBox("img1", "我的 2D 頭像", "還沒有頭像<br>（卡通頭像，不是真實照片）")}${imgBox("img2", "足球公仔 2D 圖", "還沒有足球公仔圖")}</div>
    <p style="margin-top:14px"><button class="pri" id="dl-card">⬇️ 下載作品卡（圖片）</button> <button class="sec" id="dl-json">下載紀錄（JSON）</button> <button class="sec" id="prt">🖨️ 列印／存成 PDF</button></p>
    ${CONFIG.ENDPOINT ? `<div class="card" style="margin-top:12px"><div class="k">送出給老師</div><div class="hint">按下後，作品卡圖片、草圖和文字會存到老師的雲端資料夾與試算表。需要連網；送出前請確認主題與連結。</div><p style="margin:8px 0 4px"><button class="pri" id="sub-go">☁️ 送出給老師</button></p><div class="hint" id="sub-msg" role="status">${S.sent ? "✅ 上次送出：" + fmtT(S.sent.t) + "（修改後可再送一次）" : "還沒送出"}</div></div>` : ""}

    const bind = (id, k) => { $("#" + id).oninput = (e) => { w[k] = e.target.value; save(); if (k === "topic") { const v = $("#t4 .card .v"); if (v) v.textContent = w.topic || "（還沒填主題）"; } if (k === "link") { const m = $("#o-linkmsg"); m.textContent = w.link ? (okLink(w.link) ? "✅ 連結格式正確" : "⚠️ 連結要以 https:// 開頭") : ""; } }; };

  /* ---------- 送出給老師（Google 試算表＋雲端硬碟） ---------- */
  const fmtT = (t) => { const d = new Date(t); return (d.getMonth() + 1) + "/" + d.getDate() + " " + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); };
  async function buildPayload() {
    const w = S.w, c = await makeCard();
    return { token: CONFIG.TOKEN, cls: ID.cls, seat: ID.seat, name: S.name || "", code: T.code, role: T.role, limit: T.limit.text, scene: T.scene.text,
      pose: (POSES.find((x) => x.id === w.pose) || {}).name || "", solved: T.q.map((q, i) => !!S.solved[i]), wrong: T.q.map((q, i) => (S.tries[i] || []).length),
      s3: ["s1", "s2", "s3", "s4", "s5"].map((k) => !!S.s3[k]), topic: w.topic || "", idea: w.idea || "", link: w.link || "", prompt: w.prompt || "", tp: w.tp || "",
      card: c.toDataURL("image/jpeg", 0.86), sketch: S.draw || "", figure: w.img2 || "" };
  }
  async function submitWork() {
    const btn = $("#sub-go"), msg = $("#sub-msg"), w = S.w;
    if (!w.topic || !w.topic.trim()) { msg.textContent = "請先填「主題」再送出。"; return; }
    if (w.link && !okLink(w.link)) { msg.textContent = "作品連結要以 https:// 開頭，請修正或清空後再送出。"; return; }
    btn.disabled = true; msg.textContent = "送出中，請不要關閉頁面…";
    const ac = new AbortController(), to = setTimeout(() => ac.abort(), 60000);
    try {
      const body = JSON.stringify(await buildPayload());
      const r = await fetch(CONFIG.ENDPOINT, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body, signal: ac.signal });
      const j = await r.json();
      if (!j.ok) throw new Error(j.err || "server");
      S.sent = { t: Date.now() }; save(); msg.textContent = "✅ 已送出（" + fmtT(S.sent.t) + "）。修改後可以再送一次，會取代上一次。"; toast("已送出給老師");
    } catch (e) { msg.textContent = "⚠️ 送出失敗（可能網路不穩）。請先按「下載作品卡」留存，稍後再按一次送出。"; }
    finally { clearTimeout(to); btn.disabled = false; }
  }
  const KN = { "草圖": "sketch", "紀錄": "record", "作品卡": "card" };
  const fname = (k, ext) => "3DP_" + String(ID.cls).replace(/[^0-9A-Za-z]/g, "") + "-" + String(ID.seat).padStart(2, "0") + "_" + (KN[k] || k) + "." + ext;
  function dl(href, name) { const go = (u, rev) => { const a = document.createElement("a"); a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove(); if (rev) setTimeout(() => URL.revokeObjectURL(u), 4000); };
    try { const i = href.indexOf(","), meta = href.slice(5, i), isB64 = /;base64$/.test(meta), body = href.slice(i + 1); let blob; if (isB64) { const bin = atob(body), u8 = new Uint8Array(bin.length); for (let k = 0; k < bin.length; k++) u8[k] = bin.charCodeAt(k); blob = new Blob([u8], { type: meta.replace(/;base64$/, "") }); } else blob = new Blob([decodeURIComponent(body)], { type: meta.split(";")[0] }); go(URL.createObjectURL(blob), true); } catch (e) { go(href, false); } }
  function wrap(g, text, x, y, w, lh, max) { let line = "", n = 0; for (const ch of String(text || "")) { if (g.measureText(line + ch).width > w || ch === "\n") { g.fillText(line, x, y); y += lh; line = ch === "\n" ? "" : ch; if (++n >= max) return y; } else line += ch; } if (line) { g.fillText(line, x, y); y += lh; } return y; }
  function loadImg(src) { return new Promise((res) => { if (!src) return res(null); const im = new Image(); im.onload = () => res(im); im.onerror = () => res(null); im.src = src; }); }
  function fit(g, im, x, y, W, H) { g.fillStyle = "#f4f7fc"; g.fillRect(x, y, W, H); if (im) { const k = Math.min(W / im.width, H / im.height), w = im.width * k, h = im.height * k; g.drawImage(im, x + (W - w) / 2, y + (H - h) / 2, w, h); } else { g.fillStyle = "#9aa7bd"; g.font = "24px sans-serif"; g.textAlign = "center"; g.fillText("（尚未放圖）", x + W / 2, y + H / 2); g.textAlign = "left"; } g.strokeStyle = "#0a1a33"; g.lineWidth = 3; g.strokeRect(x, y, W, H); }
  async function makeCard() {
    const w = S.w, c = document.createElement("canvas"); c.width = 1240; c.height = 1754; const g = c.getContext("2d"), F = '"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif';
    g.fillStyle = "#fff"; g.fillRect(0, 0, 1240, 1754); g.fillStyle = "#0a1a33"; g.fillRect(0, 0, 1240, 110); g.fillStyle = "#fff"; g.font = "bold 40px " + F; g.fillText("3DP同樂製造｜我的作品卡", 50, 70);
    g.font = "26px " + F; g.fillStyle = "#ffd9b0"; g.textAlign = "right"; g.fillText(ID.cls + " 班 " + ID.seat + " 號 " + (S.name || ""), 1190, 70); g.textAlign = "left";
    g.fillStyle = "#a24a00"; g.font = "bold 24px " + F; g.fillText("主題", 50, 165); g.fillStyle = "#0a1a33"; g.font = "bold 46px " + F; let y = wrap(g, w.topic || "（我的作品）", 50, 220, 1140, 56, 2);
    const [i1, i2, i3] = await Promise.all([loadImg(w.img1), loadImg(w.img2), loadImg(S.draw)]);
    y += 10; g.fillStyle = "#5b6b86"; g.font = "bold 22px " + F; g.fillText("我的 2D 頭像", 50, y); g.fillText("足球公仔 2D 圖", 640, y); y += 14;
    fit(g, i1, 50, y, 550, 700); fit(g, i2, 640, y, 550, 700); y += 750;
    g.fillStyle = "#a24a00"; g.font = "bold 24px " + F; g.fillText("理念", 50, y); g.fillStyle = "#1c2a44"; g.font = "27px " + F; y = wrap(g, w.idea || "—", 50, y + 44, 1140, 40, 6) + 14;
    g.fillStyle = "#a24a00"; g.font = "bold 24px " + F; g.fillText("作品連結", 50, y); g.fillStyle = "#2563eb"; g.font = "23px " + F; y = wrap(g, w.link || "—", 50, y + 38, 1140, 32, 3) + 14;
    const po = POSES.find((x) => x.id === w.pose); g.fillStyle = "#5b6b86"; g.font = "21px " + F;
    if (po) { g.fillText("足球動作：" + po.name + "　　任務卡：" + T.code, 50, y + 10); y += 40; }
    if (i3 && y < 1500) { const h = Math.min(250, 1690 - y - 10); g.fillStyle = "#5b6b86"; g.font = "bold 20px " + F; g.fillText("第 2 節草圖", 50, y + 6); fit(g, i3, 50, y + 16, Math.round(h * 1.5), h); }
    g.fillStyle = "#5b6b86"; g.font = "20px " + F; g.fillText("AI 實作 " + ["s1", "s2", "s3", "s4", "s5"].filter((k) => S.s3[k]).length + " / 5　回顧三問 " + T.q.filter((q, i) => S.solved[i]).length + " / 3", 50, 1725);
    return c;
  }
  async function dlCard() { const c = await makeCard(); dl(c.toDataURL("image/png"), fname("作品卡", "png")); toast("已下載作品卡"); }

  /* ---------- 啟動 ---------- */
  document.addEventListener("DOMContentLoaded", () => {
    $("#li-go").onclick = doLogin; ["li-cls", "li-seat", "li-name"].forEach((i) => $("#" + i).addEventListener("keydown", (e) => { if (e.key === "Enter") doLogin(); }));
    $$("nav.tabs button").forEach((b) => b.onclick = () => tab(b.dataset.t)); $("#chg").onclick = () => showLogin();
    if (ID && ID.cls && ID.seat) { load(); start(); } else showLogin();
  });
})();
</script></body></html>
