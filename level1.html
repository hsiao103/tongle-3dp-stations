        const t = this.ctx.currentTime + (delay || 0), o = this.ctx.createOscillator(), g = this.ctx.createGain();
        o.type = type || "sine"; o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v || 0.15, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
        o.connect(g); g.connect(this.ctx.destination); o.start(t); o.stop(t + d + 0.03);
      } catch (e) { /* 忽略 */ }
    },
    click() { this.tone(880, 0.05, "square", 0.05); },
    good() { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.2, "triangle", 0.14, i * 0.11)); },
    bad() { this.tone(190, 0.3, "sawtooth", 0.12); this.tone(140, 0.34, "sawtooth", 0.12, 0.17); },
    snap() { this.tone(90, 0.14, "square", 0.2); this.tone(60, 0.2, "sawtooth", 0.15, 0.05); },
    latch() { this.tone(320, 0.06, "square", 0.2); this.tone(640, 0.05, "square", 0.12, 0.06); }
  };
  document.addEventListener("pointerdown", () => Snd.init(), { capture: true });
  const buzz = (ms) => { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) { /* 忽略 */ } };

  let toastTimer = 0;
  function toast(text, kind) {
    const t = $("#toast"); t.textContent = text; t.className = kind || ""; t.classList.remove("hidden");
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.add("hidden"), 3200);
  }

  /* ---------- 轉換動作 ---------- */
  function dispatch(a, quiet) {
    const r = L.reduce(state, a, Date.now());
    if (r.state !== state) { state = r.state; persist(); }
    if (!quiet) render();
    return r.fb;
  }

  /* ---------- 通用元件 ---------- */
  const STAGES = ["示範", "引導", "診斷", "列印"];
  const stageIdx = () => ({ intro: -1, A: 0, B1: 1, B2: 1, C1: 2, C2: 3, done: 4 }[state.phase]);
  function msgBox(key) { const m = msgs[key]; return el("div", { class: "msg " + (m ? m.kind : ""), id: "msg-" + key, role: "status", "aria-live": "polite" }, m ? m.text : ""); }
  function setMsg(key, text, kind) { msgs[key] = text ? { text, kind } : null; const b = $("#msg-" + key); if (b) { b.className = "msg " + (kind || ""); b.textContent = text || ""; } }
  const cardOf = (title, pass, text) => el("div", { class: "rescard " + (pass ? "pass" : "fail") }, el("b", {}, (pass ? "✔ " : "✘ ") + title), el("span", {}, text));

  /* ---------- 各關畫面 ---------- */
  /* ---------- 開場解碼：三張線索卡 → 三個輪盤 → 解密 ---------- */
  const GATE_BLANK = "？";
  let gateSlots = C.gate.answer.split("").map(() => GATE_BLANK);
  function viewGate() {
    const pool = L.gatePool(state);
    const cards = el("div", { class: "clues" }, C.gate.clues.map((c, i) => el("div", { class: "clue" },
      el("div", { class: "cn" }, String(i + 1)), el("b", {}, c.title), el("p", {}, c.text))));
    const slots = el("div", { class: "slots", role: "group", "aria-label": "密碼輪盤" }, gateSlots.map((v, i) => el("button", {
      class: "slot" + (v === GATE_BLANK ? " blank" : ""), "aria-label": "第 " + (i + 1) + " 個字元，目前是 " + v + "，點一下換下一個",
      onclick: () => {
        Snd.click(); const cur = gateSlots[i]; const idx = cur === GATE_BLANK ? -1 : pool.indexOf(cur);
        gateSlots[i] = pool[(idx + 1) % pool.length]; render();
      } }, v)));
    return el("div", { class: "panel pop" },
      el("h2", {}, "🔒 " + C.gate.title), para(C.gate.intro), cards,
      el("div", { class: "sub", style: "margin-top:10px" }, "點一下輪盤換字元。三張卡依序對應第 1、2、3 個位置。"),
      slots, msgBox("gate"),
      el("button", { class: "btn big", id: "btnGate", onclick: onGate }, "🔓 解密"));
  }
  function onGate() {
    Snd.click();
    if (gateSlots.includes(GATE_BLANK)) { setMsg("gate", C.msg.gate.incomplete, "bad"); return; }
    const fb = dispatch({ type: "gateTry", slots: gateSlots.slice() }, true);
    if (fb.kind === "gateOpen") { Snd.good(); msgs.gate = null; msgs.gateOk = { text: fb.text, kind: "good" }; render(); toast("密碼正確！", "good"); return; }
    Snd.bad(); buzz(120);
    if (fb.kind === "gateBad" || fb.kind === "repeat" || fb.kind === "incomplete") msgs.gate = { text: fb.text, kind: "bad" };
    else if (fb.kind === "cooldown") msgs.gate = { text: C.msg.cooling.replace("{n}", Math.ceil(fb.leftMs / 1000)), kind: "bad" };
    render();
  }

  function viewIntro() {
    if (!state.gate.open) return viewGate();
    const okMsg = msgs.gateOk && C.gate.enabled ? el("div", { class: "msg good", role: "status" }, msgs.gateOk.text) : null;
    return el("div", { class: "panel pop" }, okMsg,
      el("h2", {}, C.title + "：" + C.subtitle),
      artImg("s1_robot_front", "hero", "微型守護機器人"),
      para(C.story.intro),
      para("接下來會先看示範、再練習，最後自己動手調整列印參數。看得懂、做得到，才拿得到下一關的密碼。", "sub"),
      el("button", { class: "btn big", id: "btnStart", onclick: () => { Snd.click(); dispatch({ type: "start" }); } }, "開始"));
  }

  function viewA() {
    const i = state.aIdx, d = C.demo[i];
    const dots = el("div", { class: "row" }, C.demo.map((_, k) => el("span", { class: "chip " + (k === i ? "on" : (k < i ? "fin" : "")) }, String(k + 1))));
    return el("div", { class: "panel grid2 pop" },
      el("div", {}, svgEl(A.demoSVG(i))),
      el("div", {},
        el("h2", {}, d.title), para(d.body),
        i === 2 ? el("div", { class: "artrow" }, [artImg("s1_robot_thinfeet", "", "細腳機器人"), artImg("s1_robot_widefeet", "", "寬腳機器人")]) : null,
        i === 3 ? artImg("s1_arm_part", "", "拆下來的手臂零件") : null, dots,
        el("button", { class: "btn big", id: "btnNext", style: "margin-top:12px", onclick: () => {
          Snd.click(); const fb = dispatch({ type: "aNext" }, true);
          if (fb.ok) render(); else if (fb.kind === "tooEarly") toast("再看一下動畫，還要 " + Math.ceil(fb.waitMs / 1000) + " 秒", "info");
        } }, i === C.demo.length - 1 ? "看完了，去練習" : "下一張"),
        para("每張卡要看滿幾秒，按鈕才會亮起來。", "sub")));
  }

  function b1Verdict(angle) { return angle > C.b1.critical ? ["✘ 會垂落：下面沒有東西托住", "bad"] : ["✔ 可以直接印：不會垂落", "ok"]; }
  function viewB1() {
    const ang = state.b1.angle;
    const wrap = el("div", { id: "b1svg" }); wrap.innerHTML = A.b1Markup(ang);
    const readout = el("div", { class: "readout", id: "b1read" }, "θ = " + ang + "°");
    const [vt, vk] = b1Verdict(ang); const verdict = el("div", { class: "verdict " + vk, id: "b1verdict" }, vt);
    const slider = el("input", { type: "range", min: 0, max: C.b1.max, step: 1, value: ang, id: "b1slider", "aria-label": "懸空角度" });
    slider.style.touchAction = "none";
    slider.addEventListener("input", () => {
      const fb = dispatch({ type: "b1Set", angle: slider.value }, true); if (!fb.ok) return;
      wrap.innerHTML = A.b1Markup(state.b1.angle); readout.textContent = "θ = " + state.b1.angle + "°";
      const [t2, k2] = b1Verdict(state.b1.angle); verdict.className = "verdict " + k2; verdict.textContent = t2; setMsg("b1", "", "");
    });
    return el("div", { class: "panel grid2 pop" },
      el("div", {}, wrap),
      el("div", {},
        el("h2", {}, "練習 1：找出 45° 的分界"),
        para("拖曳滑桿調整「懸空角度」（和垂直線的夾角）。把角度調到「不用支撐材也印得出來的最大角度」，再按確認。"),
        readout, slider, verdict,
        el("button", { class: "btn big", style: "margin-top:8px", onclick: () => {
          Snd.click(); const fb = dispatch({ type: "b1Confirm" }, true);
          if (fb.ok) { toast("答對了！下一個練習", "good"); Snd.good(); render(); }
          else { Snd.bad(); setMsg("b1", fb.kind === "b1Low" ? "還可以再大一點：這個角度還沒到極限。" : "超過了：懸空處已經垂落。往回調一點。", "bad"); }
        } }, "確認：這就是最大角度"),
        msgBox("b1")));
  }

  function viewB2() {
    const b = state.b2;
    const sceneBox = el("div", {}); sceneBox.append(svgEl(A.sceneSVG("sceneB2")));
    const settings = ["support", "orient"].map((k) => el("div", { class: "setting" }, el("b", {}, C.labels[k].title),
      el("div", { class: "seg" }, C.flag.defaults && ["off", "on", "stand", "flat"].filter((v) => (k === "support" ? ["off", "on"] : ["stand", "flat"]).includes(v)).map((v) =>
        el("button", { class: "opt" + (b[k] === v ? " on" : ""), onclick: () => { Snd.click(); dispatch({ type: "b2Set", key: k, value: v }, true); setMsg("b2", "", ""); render(); } }, C.labels[k][v])))));
    return el("div", { class: "panel grid2 pop" },
      el("div", {}, sceneBox, el("p", { class: "sub" }, "橘色虛線框＝要特別注意的地方")),
      el("div", {},
        el("h2", {}, "練習 2：小旗子"), el("ol", { style: "margin:4px 0 8px;padding-left:22px" }, C.b2.steps.map((t) => el("li", {}, t))),
        settings,
        el("button", { class: "btn big", id: "btnB2", onclick: onB2 }, "▶ 開始列印"), msgBox("b2")));
  }
  const mapFlag = (code) => ({ ok: "ok", collapse: "collapse", okSupport: "okSupport", waste: "supportWaste" }[code]);
  function onB2() {
    if (anim) return; Snd.click();
    const set = { support: state.b2.support, arm: state.b2.orient, foot: "wide" };
    const fb = dispatch({ type: "b2Run" }, true);
    const res = { printCode: mapFlag(fb.code), dropCode: "ok", printOk: fb.code === "ok", dropOk: true };
    const dur = RM() ? 900 : 2600;
    $("#btnB2").disabled = true;
    anim = playScene($("#sceneB2"), "flag", set, res, dur, { hl: true }, (t) => { if (t >= 0.6 && !anim.cued) { anim.cued = true; res.printOk ? Snd.good() : (Snd.bad(), buzz(150)); } }, () => {
      anim = null;
      if (fb.ok) { toast(fb.text, "good"); render(); }
      else { setMsg("b2", fb.text, "bad"); const b = $("#btnB2"); if (b) b.disabled = false; }
    });
  }

  /* C1：三視圖診斷 */
  const partName = (p) => C.c1.parts[p].name;
  function markPart(part) {
    Snd.click(); const fb = dispatch({ type: "c1Mark", part }, true);

  }
  function viewC1() {
    if (!state.c1.views[c1Tab]) dispatch({ type: "c1View", view: c1Tab }, true);
    const names = { front: "前視圖", side: "側視圖", top: "俯視圖" };
    const tabs = el("div", { class: "tabs" }, ["front", "side", "top"].map((v) => el("button", { class: "tab" + (c1Tab === v ? " on" : "") + (state.c1.views[v] ? " seen" : ""), onclick: () => { Snd.click(); c1Tab = v; dispatch({ type: "c1View", view: v }, true); render(); } }, names[v])));

    svg.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { const p = e.target.closest("[data-part]"); if (p) { e.preventDefault(); markPart(p.dataset.part); } } });
    const chips = el("div", { class: "partchips" }, L.consts.PARTS.map((p) => el("button", { class: "pchip" + (state.c1.marks[p] ? " on" : ""), onclick: () => markPart(p) }, (state.c1.marks[p] ? "⚑ " : "") + partName(p))));
    const reasonPanels = L.consts.WEAK.filter((p) => state.c1.marks[p]).map((p) => {
      const sel = state.c1.reasons[p];
      return el("div", { class: "setting" }, el("b", {}, "你標了「" + partName(p) + "」，原因是？"),
        el("div", { class: "reasons" }, L.reasonOptions(state, p).map((o) => {
          const picked = sel === o.id, right = C.c1.reasons[p].find((x) => x.id === o.id).correct;
          return el("button", { class: "opt" + (picked ? (right ? " good" : " wrong") : ""), onclick: () => {
            Snd.click(); const fb = dispatch({ type: "c1Reason", part: p, option: o.id }, true);
            setMsg("c1", fb.kind === "reasonWrong" ? "這個原因不對：" + fb.text : (fb.kind === "reasonOk" ? "✔ 這個原因說得通。" : ""), fb.kind === "reasonWrong" ? "bad" : "good"); render();
          } }, o.text);
        })));
    });
    return el("div", { class: "panel grid2 pop" },
      el("div", {}, tabs, svg, el("p", { class: "note-box" }, C.c1.viewText[c1Tab]), chips),
      el("div", {},
        el("h2", {}, "診斷：找出兩個弱點"),
        para("三個視圖都要看。點選你認為會出問題的部位（可以點圖，也可以點下面的按鈕），再選出原因。"),
        reasonPanels, msgBox("c1"),

  function onC1Check() {
    Snd.click(); const fb = dispatch({ type: "c1Check" }, true);
    if (fb.ok) { Snd.good(); toast("診斷完成！列印設定台解鎖了", "good"); msgs = {}; render(); return; }
    Snd.bad();
    const names = { front: "前視圖", side: "側視圖", top: "俯視圖" };
    const t = { needViews: () => "三個視圖都要看過。還沒看：" + fb.missing.map((v) => names[v]).join("、"),

  }

  /* C2：設定與列印模擬 */
  function sceneInner() {
    if (state.phase === "done") { return A.scene("robot", state.set, { printCode: "ok", dropCode: "ok", printOk: true, dropOk: true }, 1); }
    if (lastResult) return A.scene("robot", lastResult.set, lastResult.res, 1);

  }
  function viewC2() {

    const svg = svgEl(A.sceneSVG("sceneC2")); svg.innerHTML = sceneInner();
    const left = el("div", {}, svg);
    if (lastResult && !done) left.append(el("div", { class: "res2" }, cardOf("列印階段", lastResult.res.printOk, lastResult.res.printText), cardOf("落摔階段" + (lastResult.res.printOk ? "" : "（預測）"), lastResult.res.dropOk, lastResult.res.dropText)));
    const settings = ["support", "arm", "foot"].map((k) => el("div", { class: "setting" }, el("b", {}, C.labels[k].title),
      el("div", { class: "seg" }, L.consts.KEYS[k].map((v) => el("button", { class: "opt" + (state.set[k] === v ? " on" : ""), disabled: dis, onclick: () => {
        Snd.click(); const fb = dispatch({ type: "set", key: k, value: v }, true); if (fb.ok) { lastResult = null; render(); }
      } }, C.labels[k][v])))));
    const right = el("div", {},
      el("h2", {}, done ? "列印完成" : "設定列印參數"),
      done ? para("設定已鎖定，可以重播動畫或看過關訊息。", "sub") : para("兩個弱點都要處理。想好再按開始；失敗會有冷卻時間。", "sub"),
      settings,
      el("div", { class: "row" },
        el("button", { class: "btn", id: "btnPrint", style: "flex:1", onclick: onPrint }, "▶ 開始列印模擬"),
        done ? null : el("button", { class: "btn ghost small", disabled: dis, onclick: () => { Snd.click(); if (dispatch({ type: "resetSet" }, true).ok) { lastResult = null; render(); } } }, "重設參數")),
      lastFailNote && !done ? el("div", { class: "note-box" }, el("b", {}, "上一次的失敗原因："), lastFailNote) : null);
    return el("div", { class: "panel grid2 pop" }, left, right);
  }
  function printBtnState() {
    if (state.phase === "done") return { label: "🔁 重播成功動畫", dis: state.animating || !!anim };
    if (state.animating || anim) return { label: "模擬進行中…", dis: true };
    if (state.locked) return { label: "機器暫停", dis: true };
    const left = L.cooldownLeft(state, Date.now());
    if (left > 0) return { label: C.msg.cooling.replace("{n}", Math.ceil(left / 1000)), dis: true };
    return { label: "▶ 開始列印模擬", dis: false };
  }
  function onPrint() {
    if (anim) return; Snd.click();
    const fb = dispatch({ type: "print", animMs: RM() ? 1200 : C.timing.animMs }, true);
    if (!fb.ok) {
      const m = { cooldown: () => C.msg.cooling.replace("{n}", Math.ceil(fb.leftMs / 1000)), repeat: () => C.msg.repeat, needTutorial: () => C.msg.needTutorial, needC1: () => C.msg.needC1, busy: () => "" }[fb.kind];
      if (m && m()) toast(m(), "info"); chrome(); return;
    }
    playPrint(fb);
  }
  function playPrint(fb) {
    const set = Object.assign({}, state.set), res = fb.kind === "replay" ? { printCode: "ok", dropCode: "ok", printOk: true, dropOk: true } : fb.result;
    lastResult = null; chrome();
    const dur = RM() ? 900 : (Number(C.timing.animMs) || 5200); const cue = {};
    anim = playScene($("#sceneC2"), "robot", set, res, dur, {}, (t) => {
      if (t >= 0.5 && !cue.a) { cue.a = 1; if (!res.printOk) { Snd.bad(); buzz(150); } }
      if (t >= 0.58 + 0.42 * 0.6 && !cue.b) { cue.b = 1; if (!res.dropOk) { Snd.snap(); buzz(260); } }
      if (t >= 0.99 && !cue.c) { cue.c = 1; if (res.printOk && res.dropOk) { Snd.latch(); Snd.good(); } }
    }, () => {
      anim = null; dispatch({ type: "animEnd" }, true);
      if (fb.kind === "fail") {
        lastResult = { set, res };
        lastFailNote = [res.printOk ? "" : "列印：" + res.printText, res.dropOk ? "" : "落摔：" + res.dropText].filter(Boolean).join("　");
        if (state.locked) toast("機器暫停，請找關主", "bad");
      } else if (fb.kind === "success") { toast("列印成功！", "good"); }
      render();
    });
  }

  /* C3：完成 */
  function viewDone() {
    const info = L.successInfo(state);
    const laser = `<svg viewBox="0 0 160 110" class="icon-laser" role="img" aria-label="雷射切割圖示"><rect x="14" y="78" width="132" height="16" rx="4" class="solid"/><rect x="62" y="16" width="36" height="26" rx="5" class="solid"/><path d="M80 42 L80 78" stroke="#ff4d5e" stroke-width="4"/><circle cx="80" cy="78" r="6" fill="#ff4d5e"><animate attributeName="r" values="4;8;4" dur="1s" repeatCount="indefinite"/></circle><path d="M30 94 L130 94" stroke="#ffb066" stroke-width="2" stroke-dasharray="4 3"/></svg>`;
    const rev = el("details", { class: "panel", style: "margin-top:10px" }, el("summary", { style: "font-weight:800;cursor:pointer" }, "想一想（選做）：把剛剛學到的說出來"),
      C.review.map((q, qi) => { const out = el("div", { class: "msg" });
        return el("div", { class: "setting", style: "margin-top:10px" }, el("b", {}, (qi + 1) + ". " + q.q),
          el("div", { class: "reasons" }, L.reviewOptions(state, qi).map((o) => el("button", { class: "opt", onclick: (ev) => {
            const fb = dispatch({ type: "review", q: qi, option: o.id }, true); Snd.click();
            ev.target.parentNode.querySelectorAll(".opt").forEach((b) => b.classList.remove("good", "wrong")); ev.target.classList.add(fb.correct ? "good" : "wrong");
            out.className = "msg " + (fb.correct ? "good" : "bad"); out.textContent = fb.text;
          } }, o.text))), out);
      }));
    const successPanel = el("div", { class: "panel pop", style: "border-color:var(--green)" },
      el("h2", {}, "✔ 機關完成！"), para(info.story),
      el("div", { class: "codebox" }, el("div", { class: "sub" }, info.label), el("div", { class: "code" }, info.code), artImg("s1_robot_salute", "hero", "守護機器人敬禮") || svgEl(laser)),
      para(info.next),
      C.nextUrl ? el("div", { class: "setting" }, el("b", {}, "怎麼進入第二關？"),
        el("ol", { style: "margin:6px 0 10px 20px;line-height:1.7" }, el("li", {}, "點下面的按鈕，第二關會自動帶入你的密碼。"), el("li", {}, "如果按鈕打不開：自己開啟第二關，在開始畫面的「第一關過關了嗎？」格子輸入 " + info.code + "，按「確認」。")),
        el("a", { class: "btn big", href: C.nextUrl + "#code=" + encodeURIComponent(info.code), style: "display:inline-block;text-decoration:none;text-align:center", id: "btnGoStage2" }, "👉 前往第二關")) : null,
      rev);
    return el("div", {}, successPanel, el("div", { style: "height:10px" }), viewC2());
  }

  function view() {
    if (state.phase !== hintPhase) { hintPhase = state.phase; hideHint(); }
    switch (state.phase) {
      case "intro": return viewIntro();
      case "A": return viewA();
      case "B1": return viewB1();
      case "B2": return viewB2();
      case "C1": return viewC1();
      case "C2": return viewC2();
      default: return viewDone();
    }
  }

  /* B2 場景在畫面出現後要先畫預覽 */
  function afterRender() {
    const sb = $("#sceneB2"); if (sb && !anim) sb.innerHTML = A.scene("flag", { support: state.b2.support, arm: state.b2.orient, foot: "wide" }, null, null, { hl: true });
  }

  /* ---------- 場景動畫（B2、C2 共用） ---------- */
  function playScene(svg, model, set, res, dur, opt, onFrame, onDone) {
    const h = { raf: 0, cued: false }; const t0 = performance.now();
    if (RM()) { svg.innerHTML = A.scene(model, set, res, 1, opt); h.raf = setTimeout(onDone, 700); return h; }
    const frame = (now) => {
      const t = Math.min(1, (now - t0) / dur); svg.innerHTML = A.scene(model, set, res, t, opt); onFrame && onFrame(t);
      if (t < 1) h.raf = requestAnimationFrame(frame); else setTimeout(onDone, 350);
    };
    h.raf = requestAnimationFrame(frame); return h;
  }

  /* ---------- 外框：階段、徽章、提示鈕、鎖機、按鈕狀態 ---------- */
  function chrome() {
    const si = stageIdx();
    $("#chips").replaceChildren(...STAGES.map((n, i) => el("span", { class: "chip" + (i === si ? " on" : (i < si ? " fin" : "")) }, (i < si ? "✓ " : "") + n)));
    $("#grp").textContent = "第 " + state.group + " 組";
    $("#donebadge").classList.toggle("hidden", !state.completed);
    const hb = $("#hintbtn"); const stg = L.hintStage(state);
    hb.classList.toggle("hidden", !stg);
    if (stg) hb.textContent = "💡 提示（已看 " + state.hintSeen[stg] + "/3 層）";
    $("#info").textContent = "第 " + state.group + " 組 · 失敗 " + state.failCount + " 次 · 提示 " + state.hintsUsed + " 次";
    const lock = $("#lock"); const showLock = state.locked && !anim && !state.animating;
    lock.classList.toggle("hidden", !showLock);
    if (showLock) $("#lockmsg").textContent = C.msg.lock.replace("{n}", C.timing.lockAfter);
    updateBtns();
  }
  function updateBtns() {
    const pb = $("#btnPrint"); if (pb) { const s = printBtnState(); pb.textContent = s.label; pb.disabled = s.dis; }
    const gb = $("#btnGate"); if (gb) { const left = Math.max(0, state.cooldownUntil - Date.now()); gb.disabled = left > 0 || state.locked; gb.textContent = left > 0 ? "噴頭清理中… " + Math.ceil(left / 1000) + " 秒" : "🔓 解密"; }
    const nb = $("#btnNext");
    if (nb) { const left = C.timing.demoMs - (Date.now() - state.cardStart); const last = state.aIdx === C.demo.length - 1;
      nb.disabled = left > 0; nb.textContent = left > 0 ? "再看 " + Math.ceil(left / 1000) + " 秒…" : (last ? "看完了，去練習" : "下一張"); }
  }
  function render() { chrome(); if (anim) return; $("#main").replaceChildren(view()); afterRender(); chrome(); }

  /* ---------- 提示 ---------- */
  function hideHint() { const s = $("#hintsheet"); if (s) s.classList.add("hidden"); }
  function onHint() {
    Snd.click(); const fb = dispatch({ type: "hint" }, true); chrome(); if (!fb.ok) return;
    const s = $("#hintsheet"); s.replaceChildren(el("div", { class: "row spread" }, el("span", { class: "lv" }, "💡 提示　第 " + fb.level + " / 3 層"), el("button", { class: "btn ghost small", onclick: hideHint }, "關閉")), el("p", { style: "margin:6px 0 0;font-size:20px" }, fb.text));
    s.classList.remove("hidden");
  }

  /* ---------- 關主：長按 3 秒 → PIN → 面板 ---------- */
  function makeHold(btn) {
    let timer = 0, raf = 0, t0 = 0; const ring = btn.querySelector(".ring");
    const stop = () => { clearTimeout(timer); cancelAnimationFrame(raf); timer = 0; if (ring) ring.style.setProperty("--p", "0deg"); };
    btn.style.touchAction = "none";
    btn.addEventListener("contextmenu", (e) => e.preventDefault());
    btn.addEventListener("pointerdown", (e) => {
      e.preventDefault(); Snd.init(); t0 = performance.now();
      const step = () => { const p = Math.min(1, (performance.now() - t0) / C.timing.holdMs); if (ring) ring.style.setProperty("--p", p * 360 + "deg"); if (p < 1) raf = requestAnimationFrame(step); };
      step(); timer = setTimeout(() => { stop(); openPin(); }, C.timing.holdMs);
    });
    ["pointerup", "pointerleave", "pointercancel"].forEach((ev) => btn.addEventListener(ev, () => { if (timer) { stop(); toast("關主專用：要長按 " + Math.round(C.timing.holdMs / 1000) + " 秒", "info"); } }));
  }
  let wrongPins = 0, pinBlockUntil = 0, pinFor = "admin";
  function closeOverlay() { const o = $("#adm"); o.classList.add("hidden"); o.replaceChildren(); }
  function openPin() {
    let pin = ""; const o = $("#adm"); o.classList.remove("hidden");
    const dots = el("div", { class: "pindots" }, "");
    const info = el("div", { class: "msg" });
    const upd = () => { dots.textContent = "●".repeat(pin.length) + "○".repeat(Math.max(0, 4 - pin.length)); };
    const submit = () => {
      if (Date.now() < pinBlockUntil) { info.className = "msg bad"; info.textContent = "輸入錯誤太多次，請 " + Math.ceil((pinBlockUntil - Date.now()) / 1000) + " 秒後再試"; return; }
      if (L.checkPin(pin)) { wrongPins = 0; openAdmin(pin); return; }
      wrongPins++; pin = ""; upd(); info.className = "msg bad"; info.textContent = "PIN 不正確"; $("#adm .box").classList.remove("shake"); void $("#adm .box").offsetWidth; $("#adm .box").classList.add("shake");
      if (wrongPins >= 3) { pinBlockUntil = Date.now() + 30000; wrongPins = 0; info.textContent = "連續錯誤 3 次，鎖定 30 秒"; }
    };
    const keys = ["1", "2", "3", "4", "5", "6", "7", "8", "9", "⌫", "0", "確定"].map((k) => el("button", { onclick: () => {
      if (k === "⌫") pin = pin.slice(0, -1); else if (k === "確定") { submit(); return; } else if (pin.length < 4) pin += k; upd(); if (pin.length === 4 && k !== "⌫") submit();
    } }, k));
    o.replaceChildren(el("div", { class: "box" }, el("h2", {}, "關主驗證"), para("請輸入 4 位數 PIN", "sub"), dots, el("div", { class: "keypad" }, keys), info, el("button", { class: "btn ghost", onclick: closeOverlay }, "取消")));
    upd();
  }
  function openAdmin(pin) {
    let g = Math.min(C.groupCodes.length, state.group + 1);
    const o = $("#adm"); const out = el("output", {}, String(g)); const codeLine = el("div", { class: "sub" });
    const upd = () => { out.textContent = String(g); codeLine.textContent = "第 " + g + " 組的過關代碼：" + L.codeFor(g); };
    const step = (d) => { g = Math.max(1, Math.min(C.groupCodes.length, g + d)); upd(); };
    const doUnlock = () => { const fb = dispatch({ type: "unlock", pin }, true); if (fb.ok) { toast("已解鎖，可以繼續", "good"); closeOverlay(); render(); } };
    const doReset = () => {
      const fb = dispatch({ type: "reset", pin, group: g, seed: newSeed() }, true);
      if (fb.ok) { store.del(); persist(); lastResult = null; lastFailNote = ""; msgs = {}; c1Tab = "front"; anim = null; hintPhase = null; gateSlots = C.gate.answer.split("").map(() => GATE_BLANK); closeOverlay(); hideHint(); render(); toast("已重來，換第 " + state.group + " 組", "good"); }
    };
    o.replaceChildren(el("div", { class: "box" },
      el("h2", {}, "關主面板"),
      el("p", { class: "sub" }, "目前：第 " + state.group + " 組 · 失敗 " + state.failCount + " 次 · 提示 " + state.hintsUsed + " 次" + (state.locked ? " · 已鎖機" : "") + (state.completed ? " · 已完成" : "")),
      state.locked ? el("button", { class: "btn big green", onclick: doUnlock }, "解鎖機器（讓這組繼續）") : null,
      el("hr", { style: "border-color:var(--line);margin:14px 0" }),
      el("b", {}, "重來，並換到下一組"), el("div", { class: "stepper" }, el("button", { onclick: () => step(-1) }, "−"), out, el("button", { onclick: () => step(1) }, "＋")), codeLine,
      el("button", { class: "btn big", style: "margin-top:8px", onclick: doReset }, "重來（全部清空）"),
      el("button", { class: "btn ghost", style: "margin-top:10px;width:100%", onclick: closeOverlay }, "關閉")));
    upd();
  }

  /* ---------- 啟動 ---------- */
  function boot() {
    document.title = C.title + "｜" + C.subtitle;
    $("#brandT").textContent = C.title; $("#brandS").textContent = C.subtitle;
    $("#hintbtn").addEventListener("click", onHint);
    makeHold($("#gear")); makeHold($("#lockhold"));
    render();
    setInterval(updateBtns, 250);
    if (/(^|[?&])test=1(&|$)/.test(location.search)) Tests.render($("#app"));
  }
  boot();
})();

</script>
