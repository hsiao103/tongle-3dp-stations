<style>
:root{
  --bg:#0a1a33; --panel:#13233f; --panel2:#1a2f52; --line:#2f5086; --text:#ffffff; --sub:#b9cbe8;
  --orange:#ff8a1f; --orange2:#ffb066; --green:#39ff88; --red:#ff4d5e; --blue:#5aa9ff; --amber:#ffd24d;
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;font-size:18px;line-height:1.55}
body{
  background-image:linear-gradient(rgba(90,150,230,.16) 1px,transparent 1px),linear-gradient(90deg,rgba(90,150,230,.16) 1px,transparent 1px),
    linear-gradient(rgba(90,150,230,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(90,150,230,.07) 1px,transparent 1px);
  background-size:96px 96px,96px 96px,16px 16px,16px 16px;
}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#app{max-width:1180px;margin:0 auto;padding:10px 14px 90px;min-height:100dvh;display:flex;flex-direction:column;gap:12px}

/* 上方列 */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:6;background:rgba(10,26,51,.94);padding:6px 4px;margin:0 -4px;border-radius:0 0 12px 12px}
.brand{display:flex;flex-direction:column;line-height:1.2}
.brand b{font-size:24px;letter-spacing:.04em}.brand span{font-size:15px;color:var(--orange2)}
.chips{display:flex;gap:6px;flex:1;justify-content:center;flex-wrap:wrap}
.chip{padding:5px 14px;border-radius:99px;border:2px solid var(--line);color:var(--sub);font-size:16px;white-space:nowrap}
.chip.on{background:var(--orange);border-color:var(--orange);color:#1a0d00;font-weight:800}
.chip.fin{border-color:var(--green);color:var(--green)}
.badge{padding:5px 12px;border-radius:10px;font-size:16px;font-weight:700;border:2px solid var(--line);background:var(--panel)}
.badge.done{border-color:var(--green);color:var(--green);box-shadow:0 0 14px rgba(57,255,136,.4)}
#gear{width:52px;height:52px;border-radius:50%;border:2px solid var(--line);background:var(--panel);font-size:24px;position:relative;opacity:.8;padding:0}
#gear .ring{position:absolute;inset:-5px;border-radius:50%;background:conic-gradient(var(--orange) var(--p,0deg),transparent 0);-webkit-mask:radial-gradient(circle,transparent 60%,#000 62%);mask:radial-gradient(circle,transparent 60%,#000 62%);pointer-events:none}

/* 面板 */
.panel{background:linear-gradient(180deg,var(--panel2),var(--panel));border:2px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.panel h2{margin:0 0 8px;font-size:23px}.panel h3{margin:0 0 6px;font-size:19px;color:var(--orange2)}
.panel p{margin:6px 0}
.sub{color:var(--sub);font-size:16px}
.grid2{display:grid;grid-template-columns:1.15fr 1fr;gap:12px}
@media (max-width:860px){.grid2{grid-template-columns:1fr}#app{padding-bottom:100px}.brand b{font-size:20px}}
@media (max-width:640px){.top{gap:6px}.brand{flex:1;min-width:0}.brand b{font-size:18px}.brand span{font-size:12px}.chips{order:5;flex-basis:100%;gap:4px}.chip{padding:3px 10px;font-size:14px;flex:1;text-align:center}#gear{width:46px;height:46px}.badge{padding:4px 8px;font-size:14px}.panel{padding:12px}.readout{font-size:32px}.codebox .code{font-size:56px}}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{justify-content:space-between}

/* 按鈕 */
.btn{min-height:58px;padding:10px 22px;border-radius:14px;border:0;background:var(--orange);color:#1a0d00;font-weight:800;font-size:21px;box-shadow:0 4px 0 #a85509}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #a85509}
.btn.ghost{background:transparent;color:var(--text);border:2px solid var(--line);box-shadow:none;font-weight:600}
.btn.green{background:var(--green);box-shadow:0 4px 0 #1b9b52}
.btn[disabled]{background:#3a465c;color:#8e9bb3;box-shadow:none;cursor:not-allowed;transform:none}
.btn.big{width:100%;min-height:68px;font-size:24px}
.btn.small{min-height:44px;font-size:16px;padding:6px 14px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{min-height:62px;padding:8px 10px;border-radius:12px;border:2px solid var(--line);background:#0e1c34;font-size:17px;text-align:center;line-height:1.3}
.opt.on{border-color:var(--orange);background:rgba(255,138,31,.2);font-weight:800;box-shadow:0 0 0 2px var(--orange) inset}
.opt[disabled]{opacity:.55;cursor:not-allowed}
.optgrid{display:grid;grid-template-columns:1fr;gap:8px}
.setting{margin-bottom:10px}.setting>b{display:block;margin-bottom:4px;color:var(--orange2)}

/* SVG */
svg{display:block;width:100%;height:auto}
.ground{stroke:#6f8fbf;stroke-width:2}
.solid{fill:#2a4a80;stroke:#9cc4ff;stroke-width:2}
.accent{fill:#143258;stroke:var(--amber);stroke-width:2}
.led{fill:var(--green)}
.dash{stroke:var(--amber);stroke-width:2;stroke-dasharray:5 4}
.dim{stroke:#9cc4ff;stroke-width:1.5;fill:none}
.arc{stroke:var(--amber);stroke-width:2}
.note{fill:var(--amber);font-size:14px;font-weight:700}
.cap{fill:var(--sub);font-size:15px}
.contact{fill:none;stroke:var(--orange);stroke-width:2;stroke-dasharray:3 2}
.bed2{fill:rgba(255,255,255,.04);stroke:#38598f;stroke-dasharray:6 5}
.hit{fill:transparent;stroke:none}
.view3 .part{cursor:pointer;outline:none}
.view3 .part:hover .solid,.view3 .part:focus-visible .solid{stroke:#fff}
.view3 .part.marked .solid,.view3 .part.marked .contact{stroke:var(--orange);stroke-width:4;fill:rgba(255,138,31,.35);filter:drop-shadow(0 0 6px var(--orange))}
.view3 .part.marked .contact{fill:var(--orange)}
.ledge{stroke-width:16;stroke-linecap:butt}.ok-ledge{stroke:var(--green)}.bad-ledge{stroke:var(--red)}
.ref45{stroke:var(--amber);stroke-width:2;stroke-dasharray:6 5}
.noodle{fill:none;stroke:#ff9d6e;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
.noodle.bad{stroke:var(--red)}
.okt{fill:var(--green);font-weight:700}.badt{fill:#ff8d97;font-weight:700}
.lattice{fill:none;stroke:#7fe3ff;stroke-width:2.5;stroke-dasharray:5 3}.lattice.waste{stroke:#ff9d6e}
.crack{fill:none;stroke:var(--red);stroke-width:3}
.scratch{fill:none;stroke:var(--red);stroke-width:2}
.scene{background:radial-gradient(ellipse at 50% 100%,rgba(90,150,230,.18),transparent 70%);border-radius:12px}
.bed{fill:#4a5b7a;stroke:#9db2d6;stroke-width:2}.bedt{fill:#d7e3f8;font-size:10px}
.rail{stroke:#8aa4d0;stroke-width:3}.carr{fill:#3b5f9c;stroke:#9cc4ff}.nozzle{fill:var(--orange)}
.lab{fill:var(--orange2);font-size:15px;font-weight:700}
.led2{stroke:#0004;stroke-width:1}.led2.off{fill:#445}.led2.heat{fill:var(--orange)}.led2.green{fill:var(--green);filter:drop-shadow(0 0 5px var(--green))}.led2.red{fill:var(--red);filter:drop-shadow(0 0 5px var(--red))}
.snap{fill:var(--red);font-weight:900}
.hlbox{stroke:var(--orange);stroke-width:3;stroke-dasharray:8 5;animation:pulse 1.2s ease-in-out infinite}
.bad{stroke:var(--red)!important;animation:flash .5s ease-in-out 4}
.demo{background:rgba(255,255,255,.04);border-radius:12px}
.hatch{animation:none}
.peg{fill:var(--amber);stroke:#0006;stroke-width:1}.seam{stroke:var(--amber);stroke-width:2;stroke-dasharray:3 2}
.hole{fill:#06101f;stroke:#9cc4ff;stroke-width:2}.glue{fill:var(--orange2)}
@keyframes slidein{0%,15%{transform:translateX(30px)}55%,100%{transform:translateX(-20px)}}
.slidein{animation:slidein 3.6s ease-in-out infinite}
@keyframes slidein2{0%,15%{transform:translateX(26px)}55%,100%{transform:translateX(0)}}
.slidein2{animation:slidein2 3.6s ease-in-out infinite}

/* 動畫 */
@keyframes pulse{50%{opacity:.35}}
@keyframes flash{50%{filter:drop-shadow(0 0 8px var(--red));fill:rgba(255,77,94,.55)}}
@keyframes droop{0%,30%{transform:rotate(0)}70%,100%{transform:rotate(50deg)}}
.droop{animation:droop 3.2s ease-in-out infinite}
@keyframes armfall{0%,45%{transform:rotate(0)}70%,100%{transform:rotate(20deg) translateY(4px)}}
.armfall{animation:armfall 3.6s ease-in infinite}
@keyframes crackin{0%,55%{opacity:0}70%,100%{opacity:1}}
.demo .crack{animation:crackin 3.6s infinite}
@keyframes wob{0%,40%{transform:rotate(0)}70%{transform:rotate(9deg)}100%{transform:rotate(60deg) translateY(10px)}}
.wobble{animation:wob 3.4s ease-in infinite}
@keyframes steady{50%{transform:translateY(-3px)}}
.steady{animation:steady 1.6s ease-in-out infinite}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.shake{animation:shake .4s}
@keyframes pop{0%{transform:scale(.8);opacity:0}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .35s ease-out}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .droop{transform:rotate(50deg)}.armfall{transform:rotate(20deg) translateY(4px)}.wobble{transform:rotate(60deg) translateY(10px)}.slidein{transform:translateX(-20px)}
}

/* 範圍滑桿 */
input[type=range]{width:100%;height:56px;touch-action:none;accent-color:var(--orange);background:transparent}
input[type=range]::-webkit-slider-thumb{width:44px;height:44px}
input[type=range]::-moz-range-thumb{width:44px;height:44px}
.readout{font-size:40px;font-weight:900;color:var(--amber);text-align:center;letter-spacing:.02em}
.verdict{font-size:20px;font-weight:800;text-align:center;min-height:32px}
.verdict.ok{color:var(--green)}.verdict.bad{color:#ff8d97}

/* 診斷 */
.tabs{display:flex;gap:8px;margin-bottom:8px}
.tab{flex:1;min-height:52px;border-radius:12px;border:2px solid var(--line);background:#0e1c34;font-size:18px;font-weight:700}
.tab.on{border-color:var(--orange);background:rgba(255,138,31,.2)}
.tab.seen::after{content:" ✓";color:var(--green)}
.partchips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0}
.pchip{min-height:56px;border-radius:12px;border:2px solid var(--line);background:#0e1c34;font-size:18px;font-weight:700}
.pchip.on{border-color:var(--orange);background:rgba(255,138,31,.25)}
.reasons{display:grid;gap:8px;margin-top:6px}
.reasons .opt{text-align:left;padding:10px 14px}
.reasons .opt.good{border-color:var(--green);background:rgba(57,255,136,.15)}
.reasons .opt.wrong{border-color:var(--red);background:rgba(255,77,94,.15)}

/* 結果 */
.res2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
@media (max-width:560px){.res2{grid-template-columns:1fr}}
.rescard{border-radius:12px;border:2px solid var(--line);padding:10px 12px;background:#0e1c34}
.rescard.pass{border-color:var(--green)}.rescard.fail{border-color:var(--red);background:rgba(255,77,94,.1)}
.rescard b{display:block;font-size:19px}.rescard.pass b{color:var(--green)}.rescard.fail b{color:#ff8d97}
.note-box{border-left:5px solid var(--amber);background:rgba(255,210,77,.1);padding:8px 12px;border-radius:8px;margin-top:8px}
.msg{min-height:28px;margin-top:8px;font-size:18px}
.msg.bad{color:#ff9aa3}.msg.good{color:var(--green)}.msg.info{color:var(--amber)}

/* 成功 */
.codebox{margin:10px 0;padding:14px;border:3px dashed var(--green);border-radius:16px;text-align:center;background:rgba(57,255,136,.08)}
.codebox .code{font-size:72px;font-weight:900;letter-spacing:.2em;color:var(--green);text-shadow:0 0 18px rgba(57,255,136,.6);line-height:1.1}
.icon-laser{width:120px;margin:0 auto}

/* 底部列 */
.foot{position:fixed;left:0;right:0;bottom:0;padding:8px 14px calc(8px + env(safe-area-inset-bottom));background:linear-gradient(0deg,#07122b 70%,transparent);display:flex;gap:10px;align-items:center;justify-content:center;z-index:5}
.foot .info{position:absolute;left:14px;bottom:4px;font-size:12px;color:#6f86ab;pointer-events:none}
#hintsheet{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);width:min(680px,94vw);z-index:8;background:#0f2a3f;border:3px solid var(--amber);border-radius:16px;padding:12px 16px;box-shadow:0 10px 30px #000a}
#hintsheet .lv{color:var(--amber);font-weight:800}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:30;max-width:92vw;padding:10px 18px;border-radius:12px;font-weight:700;background:#102b4d;border:2px solid var(--line);box-shadow:0 8px 24px #000a}
#toast.bad{border-color:var(--red);background:#3a1620}#toast.good{border-color:var(--green)}

/* 覆蓋層 */
.overlay{position:fixed;inset:0;z-index:20;background:rgba(5,12,28,.88);display:flex;align-items:center;justify-content:center;padding:16px}
.overlay .box{max-width:560px;width:100%;background:var(--panel);border:3px solid var(--orange);border-radius:20px;padding:20px;text-align:center}
.overlay.lock .box{border-color:var(--red)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.keypad button{min-height:60px;font-size:26px;border-radius:12px;border:2px solid var(--line);background:#0e1c34}
.pindots{font-size:34px;letter-spacing:.4em;min-height:48px}
.stepper{display:flex;align-items:center;justify-content:center;gap:14px;margin:8px 0}
.stepper button{width:56px;height:56px;border-radius:12px;border:2px solid var(--line);background:#0e1c34;font-size:28px}
.stepper output{font-size:40px;font-weight:900;min-width:70px}

/* 測試面板 */
.testpanel{background:#06101f;border:2px solid var(--blue);border-radius:12px;padding:8px 12px;font-size:14px;max-height:46vh;overflow:auto}
.testpanel summary{font-weight:800;cursor:pointer}.testpanel ul{margin:6px 0 0;padding-left:18px}
.testpanel .good{color:var(--green)}.testpanel .bad{color:#ff8d97}
.hidden{display:none!important}

/* ---- 開場解碼 ---- */
.clues{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:12px 0}
.clue{position:relative;background:var(--panel2);border:2px dashed var(--orange2);border-radius:var(--r);padding:14px 14px 12px 14px}
.clue .cn{position:absolute;top:-14px;left:12px;width:30px;height:30px;border-radius:50%;background:var(--orange);color:#0a1a33;font-weight:900;display:grid;place-items:center}
.clue b{display:block;color:var(--orange2);margin-bottom:4px}.clue p{margin:0;font-size:16px;line-height:1.5}
.slots{display:flex;gap:14px;justify-content:center;margin:12px 0}
.slot{min-width:84px;height:96px;font-size:48px;font-weight:900;font-family:ui-monospace,Menlo,Consolas,monospace;border-radius:16px;border:3px solid var(--orange);background:#0d1d38;color:var(--green);cursor:pointer;touch-action:manipulation;box-shadow:inset 0 0 18px rgba(57,255,136,.18)}
.slot.blank{color:#6f86ab}.slot:active{transform:translateY(2px)}
@media (max-width:700px){.clues{grid-template-columns:1fr}.slot{min-width:72px;height:84px;font-size:40px}}

/* ---- 插圖（圖缺了就整塊不顯示，畫面照常） ---- */
.artimg{display:block;max-width:100%;height:auto;margin:8px auto;border-radius:14px;pointer-events:none;user-select:none}
.artimg.hero{max-height:230px;width:auto}
.artimg.banner{width:100%;max-width:640px;aspect-ratio:16/9;object-fit:cover;border:2px solid var(--line)}
.artrow{display:flex;gap:10px;justify-content:center;align-items:flex-end;flex-wrap:wrap}.artrow .artimg{max-height:150px;width:auto;margin:4px}
@media (max-width:640px){.artimg.hero{max-height:170px}}
@media (prefers-reduced-motion:no-preference){.artimg{animation:artin .35s ease-out}}@keyframes artin{from{opacity:0;transform:translateY(4px)}to{opacity:1}}

</style>
