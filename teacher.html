  function table() {
    const { c, a } = data(); const seen = {}; a.forEach((d) => { const k = d.role + d.limit.id + d.scene.id; seen[k] = (seen[k] || 0) + 1; }); const dup = Object.values(seen).some((v) => v > 1);
    $("#out").innerHTML = `<div class="printarea"><h2>${esc(c)} 班・解答對照表</h2><p class="hint">${dup ? "⚠️ 有重複組合" : "✅ 全班任務組合都不重複"}。「期待作品要點」是第 2 節檢核時，學生的設計應該要處理到的結構問題。</p>
    <table class="t" style="font-size:13px"><tr><th>座號</th><th>角色／結構／情境</th><th>Q1 機型材料</th><th>Q2 印前檢核</th><th>Q3 結構</th><th>期待作品要點</th><th>秘密功能</th></tr>` +
      a.map((d) => { const o = (q) => { const x = q.options.find((p) => p.correct); return "<b>" + x.id + "</b>　" + esc(x.text); }; return `<tr><td>${d.seat}<br><small>${esc(d.code)}</small></td><td>${esc(d.role)}<br>${esc(d.limit.text)}<br><small>${esc(d.scene.id === "fine" ? "手掌大的細緻收藏" : d.scene.id === "play" ? "小朋友直接玩" : d.scene.id === "big" ? "大件省預算" : "現場多人圍觀")}</small></td><td>${o(d.q[0])}</td><td>${o(d.q[1])}</td><td>${o(d.q[2])}</td><td>${esc(d.limit.fix)}</td><td>${esc(d.bonus.text)}</td></tr>`; }).join("") + `</table></div>`;
  }
  function papers() {
    const { a } = data();
    $("#papers").innerHTML = a.map((d) => {
      const opts = (q) => q.options.map((o) => `<div class="o">○ ${o.id}．${esc(o.text)}</div>`).join("");
      const front = `<div class="psheet"><h4><span>3DP同樂製造・學習單（一）回顧三問</span><small>${esc(d.cls)} 班　${d.seat} 號　姓名：＿＿＿＿＿＿＿</small></h4>
        <div class="ptask"><div><b>我的角色</b>${esc(d.role)}</div><div><b>結構特色</b>${esc(d.limit.text)}</div><div style="grid-column:1/3"><b>使用情境</b>${esc(d.scene.text)}</div><div style="grid-column:1/3"><b>任務卡編號</b>${esc(d.code)}</div></div>
        ${d.q.map((q, i) => `<div class="pq"><div class="s">第 ${i + 1} 問・${esc(q.topic)}</div><div>${esc(q.stem)}</div>${q.reading ? q.reading.map((r) => `<div class="pread"><b>${esc(r[0])}</b>　${esc(r[1])}</div>`).join("") : ""}${opts(q)}</div>`).join("")}
        <div class="pfoot"><span>圈出你的答案。不計分，是幫你檢查自己懂了沒。</span><span>3DP工作平台學習・請依序挑戰</span></div></div>`;
      const back = `<div class="psheet"><h4><span>學習單（二）想像挑戰：設計我的公仔</span><small>${esc(d.cls)} 班　${d.seat} 號　${esc(d.code)}</small></h4>
        <div class="leg">我要設計：<b>${esc(d.role)}，${esc(d.limit.text)}</b>。用在：${esc(d.scene.text)}</div>
        <div class="leg" style="margin-top:1mm">在草圖上標記：<b>◯ 懸空</b>（紅圈）　<b>∥ 支撐</b>（藍線）　<b>▬ 底座</b>（綠色）</div>
        <div class="sk"></div>
        <div>公仔名字：＿＿＿＿＿＿＿＿＿　一句話故事：＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿</div>
        <div style="margin-top:1.5mm">我預測最容易印失敗的地方：<div class="ln"></div></div>
        <div style="margin-top:1.5mm">我的解法：${FIXES.map((f) => "☐ " + f).join("　")}</div>
        <div style="margin-top:1.5mm">機型與材料：☐ FDM＋PLA　☐ FDM＋其他耗材　☐ 光固化＋樹脂　理由（要提到使用情境）：<div class="ln"></div><div class="ln"></div></div>
        <div style="margin-top:1.5mm"><b>想像加分：${esc(d.bonus.text)}</b><br><span class="leg">想一想：${esc(d.bonus.think)}</span><div class="ln"></div></div>
        <div style="margin-top:1.5mm">同學互相挑錯（同學編號：＿＿＿＿＿）　他的公仔可能印不出來的地方：<div class="ln"></div></div>
        <div style="margin-top:1.5mm">自評：☐ ⭐ 我能指出哪裡懸空　☐ ⭐ 我知道為什麼要加底座或支撐　☐ ⭐ 我有自己的點子</div>
        <div class="pfoot"><span>完成後，請在數位版「作品卡」存下你的學習紀錄。</span><span>3DP工作平台學習・請依序挑戰</span></div></div>`;
      return front + back; }).join("");
  }
  function go(m) { mode = m; if (m === "table") { document.body.classList.remove("paper"); $("#papers").innerHTML = ""; table(); } }
  function printSheets() { table(); papers(); document.body.classList.add("paper"); setTimeout(() => { window.print(); }, 200); }
  function printTable() { document.body.classList.remove("paper"); $("#papers").innerHTML = ""; table(); const st = document.createElement("style"); st.id = "pt"; st.textContent = "@media print{.ui .noprint{display:none!important}.ui header{display:none!important}.ui{display:block!important}}"; document.head.appendChild(st); window.print(); setTimeout(() => st.remove(), 500); }
  document.addEventListener("DOMContentLoaded", () => { $("#tg").onclick = () => go("table"); $("#tp1").onclick = printSheets; $("#tp2").onclick = printTable; table(); });
})();
</script></body></html>
